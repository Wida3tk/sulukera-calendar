<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Save the Date — سلوكيرا</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, getDoc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCJG0sOcs0Wr6QslTUKmDshs9LapFyjs1w",
      authDomain: "sulukera-calendar.firebaseapp.com",
      projectId: "sulukera-calendar",
      storageBucket: "sulukera-calendar.firebasestorage.app",
      messagingSenderId: "729863935633",
      appId: "1:729863935633:web:c3069e853fa11e4d4b9130"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    // برامج سلوكيرا
    const ALL_PROGRAMS = [
      { id: "ABA",      nameAr: "برنامج ABA",        nameEn: "ABA Program"   },
      { id: "ABA_MAY",  nameAr: "ABA — دفعة مايو",   nameEn: "ABA May Batch" },
      { id: "BATCH_11", nameAr: "دفعة 11",            nameEn: "Batch 11"      },
      { id: "BATCH_10", nameAr: "دفعة 10",            nameEn: "Batch 10"      },
      { id: "OBM",      nameAr: "OBM-P Live",         nameEn: "OBM-P Live"    },
      { id: "BE",       nameAr: "برنامج BE",           nameEn: "BE Program"    },
      { id: "ABAT",     nameAr: "ABAT Live",          nameEn: "ABAT Live"     },
      { id: "OBM_EC",   nameAr: "OBM E&C",            nameEn: "OBM E&C"       },
    ];

    // تدرجات لونية لكل برنامج
    const CARD_GRADIENTS = [
      ["#0D40FC","#55D7FF"],
      ["#001442","#0D40FC"],
      ["#7c3aed","#a78bfa"],
      ["#0D40FC","#001442"],
      ["#0369a1","#55D7FF"],
      ["#1e3a8a","#3b82f6"],
      ["#4f46e5","#818cf8"],
      ["#0c4a6e","#0D40FC"],
    ];

    const MONTHS_AR = ["يناير","فبراير","مارس","أبريل","مايو","يونيو",
                       "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

    let isAdmin    = false;
    let allFbData  = {};
    let stdData    = {}; // save-the-date data from Firebase

    // ── Auth ──
    onAuthStateChanged(auth, user => {
      isAdmin = !!user;
      document.getElementById("admin-bar").style.display = isAdmin ? "flex" : "none";
      document.getElementById("login-fab").style.display = isAdmin ? "none" : "flex";
    });

    window.doLogin = async () => {
      const e = document.getElementById("fab-email").value.trim();
      const p = document.getElementById("fab-pass").value;
      const err = document.getElementById("fab-err");
      err.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, e, p);
        document.getElementById("login-popup").style.display = "none";
      } catch {
        err.textContent = "بيانات خاطئة";
      }
    };
    window.doLogout = () => signOut(auth);
    window.toggleLoginPopup = () => {
      const p = document.getElementById("login-popup");
      p.style.display = p.style.display === "flex" ? "none" : "flex";
    };

    // ── Load data ──
    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("fab-pass")?.addEventListener("keydown", e => {
        if (e.key === "Enter") window.doLogin();
      });

      // قراءة calendars للتأكد من visibility
      onSnapshot(collection(db,"calendars"), snap => {
        allFbData = {};
        snap.forEach(d => { allFbData[d.id] = d.data(); });
      }, () => {
        document.getElementById("cards-grid").innerHTML = `<div class="empty">تعذر تحميل البرامج — راجعي صلاحيات Firestore</div>`;
      });

      // قراءة save-the-date
      onSnapshot(collection(db,"savethedate"), snap => {
        stdData = {};
        snap.forEach(d => { stdData[d.id] = d.data(); });
        renderCards();
      }, () => {
        document.getElementById("cards-grid").innerHTML = `<div class="empty">تعذر تحميل المواعيد — راجعي صلاحيات Firestore</div>`;
      });
    });

    // ── Render ──
    function renderCards() {
      const grid = document.getElementById("cards-grid");
      let html = "";

      ALL_PROGRAMS.forEach((prog, idx) => {
        const std     = stdData[prog.id] || {};
        const visible = std.visible !== false; // default: true
        const date    = std.startDate || "";   // "2026-03-15"
        const grad    = CARD_GRADIENTS[idx % CARD_GRADIENTS.length];

        if (!isAdmin && !visible) return; // الطلاب لا يرون المخفية

        let dateDisplay = "";
        if (date) {
          const d = new Date(date + "T00:00:00");
          dateDisplay = `${d.getDate()} ${MONTHS_AR[d.getMonth()]} ${d.getFullYear()}`;
        }

        html += `
        <div class="card-wrap ${!visible ? "card-hidden-admin" : ""}" id="card-wrap-${prog.id}">
          <!-- البطاقة القابلة للتصدير -->
          <div class="std-card" id="card-${prog.id}"
            style="--g1:${grad[0]};--g2:${grad[1]}">

            <div class="card-watermark">سلوكيرا</div>

            <div class="card-top">
              <div class="card-logo">س</div>
              <div class="card-brand">
                <span class="card-brand-main">سلوكيرا</span>
                <span class="card-brand-sub">Sulukera Academy</span>
              </div>
            </div>

            <div class="card-badge">Save the Date</div>

            <div class="card-prog-name">${prog.nameAr}</div>
            <div class="card-prog-en">${prog.nameEn}</div>

            ${dateDisplay
              ? `<div class="card-date-wrap">
                  <div class="card-date-label">تاريخ البداية</div>
                  <div class="card-date-val">${dateDisplay}</div>
                </div>`
              : `<div class="card-date-wrap card-date-soon">
                  <div class="card-date-val">قريباً</div>
                  <div class="card-date-label">يُعلَن عن الموعد قريباً</div>
                </div>`
            }

            <div class="card-footer-line"></div>
            <div class="card-footer-text">sulukera.com</div>
          </div>

          <!-- أزرار تحت البطاقة -->
          <div class="card-actions">
            <button class="act-btn export-btn" onclick="exportCard('${prog.id}','${prog.nameAr}')">
              ⬇ تحميل
            </button>
            ${isAdmin ? `
              <button class="act-btn edit-btn-std" onclick="openEdit('${prog.id}')">
                ✏️ تعديل
              </button>
              <button class="act-btn ${visible ? "hide-btn" : "show-btn"}"
                onclick="toggleVisible('${prog.id}',${!visible})">
                ${visible ? "إخفاء" : "إظهار"}
              </button>` : ""}
          </div>
        </div>`;
      });

      grid.innerHTML = html || `<div class="empty">لا توجد إعلانات حالياً</div>`;
    }

    // ── Export card as image ──
    window.exportCard = async (id, name) => {
      const card = document.getElementById(`card-${id}`);
      if (!card) return;

      const btn = card.closest(".card-wrap").querySelector(".export-btn");
      btn.textContent = "⏳ ...";
      btn.disabled    = true;

      try {
        await document.fonts.ready;
        const canvas = await html2canvas(card, {
          scale: 3,
          useCORS: true,
          backgroundColor: null,
          logging: false,
        });
        const link    = document.createElement("a");
        link.download = `sulukera-savethedate-${id}.png`;
        link.href     = canvas.toDataURL("image/png");
        link.click();
      } catch(e) {
        alert("خطأ في التصدير");
        console.error(e);
      }

      btn.textContent = "⬇ تحميل";
      btn.disabled    = false;
    };

    // ── Admin: toggle visibility ──
    window.toggleVisible = async (id, val) => {
      await setDoc(doc(db,"savethedate",id), {visible: val}, {merge:true});
      showToast(val ? "✓ البطاقة ظاهرة" : "✗ البطاقة مخفية");
    };

    // ── Admin: edit date ──
    window.openEdit = id => {
      const std = stdData[id] || {};
      const prog = ALL_PROGRAMS.find(p => p.id===id);
      document.getElementById("edit-prog-name").textContent = prog?.nameAr || id;
      document.getElementById("edit-date-input").value = std.startDate || "";
      document.getElementById("edit-id").value = id;
      document.getElementById("edit-modal").style.display = "flex";
    };

    window.closeEdit = () => {
      document.getElementById("edit-modal").style.display = "none";
    };

    window.saveEdit = async () => {
      const id   = document.getElementById("edit-id").value;
      const date = document.getElementById("edit-date-input").value;
      await setDoc(doc(db,"savethedate",id), {startDate: date}, {merge:true});
      closeEdit();
      showToast("✓ تم حفظ التاريخ");
    };

    window.clearDate = async () => {
      const id = document.getElementById("edit-id").value;
      await setDoc(doc(db,"savethedate",id), {startDate: ""}, {merge:true});
      closeEdit();
      showToast("تم مسح التاريخ");
    };

    // ── Toast ──
    window.showToast = (msg, type="success") => {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className   = `toast show ${type}`;
      setTimeout(() => t.classList.remove("show"), 3000);
    };
  </script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --blue:#0D40FC;--cyan:#55D7FF;--navy:#001442;
      --bg:#f0f3ff;--card:#fff;--text:#0a1628;
      --muted:#6b7a9a;--border:#e0e8ff;
    }
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);
         min-height:100vh;direction:rtl;}

    /* ── Header ── */
    header{background:var(--navy);padding:20px 32px;display:flex;align-items:center;gap:14px;}
    .logo-mark{width:40px;height:40px;background:linear-gradient(135deg,var(--blue),var(--cyan));
               border-radius:10px;display:flex;align-items:center;justify-content:center;
               font-size:18px;font-weight:800;color:#fff;flex-shrink:0;}
    .header-text h1{font-size:17px;font-weight:700;color:#fff;}
    .header-text p{font-size:12px;color:var(--cyan);margin-top:1px;}
    .header-nav{margin-right:auto;display:flex;gap:10px;align-items:center;}
    .nav-link{color:rgba(255,255,255,.5);text-decoration:none;font-size:13px;transition:.2s;}
    .nav-link:hover{color:#fff;}

    /* ── Admin bar ── */
    #admin-bar{display:none;background:#001030;padding:10px 32px;align-items:center;
               justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.07);}
    .admin-label{font-size:12px;color:rgba(255,255,255,.4);}
    .logout-btn{padding:6px 14px;background:transparent;border:1px solid rgba(255,255,255,.2);
                border-radius:8px;color:rgba(255,255,255,.5);font-family:'Tajawal',sans-serif;
                font-size:12px;cursor:pointer;transition:.2s;}
    .logout-btn:hover{color:#fff;border-color:rgba(255,255,255,.5);}

    /* ── Main ── */
    main{max-width:1100px;margin:0 auto;padding:40px 20px 80px;}

    .page-intro{text-align:center;margin-bottom:40px;}
    .page-intro h2{font-size:26px;font-weight:800;color:var(--navy);margin-bottom:8px;}
    .page-intro p{font-size:15px;color:var(--muted);}

    /* ── Cards Grid ── */
    #cards-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:28px;
    }

    .card-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;}
    .card-hidden-admin{opacity:.55;}
    .card-hidden-admin .std-card::after{
      content:"مخفي";position:absolute;top:10px;left:10px;
      background:rgba(255,0,0,.7);color:#fff;font-size:11px;font-weight:700;
      padding:3px 8px;border-radius:6px;
    }

    /* ══ THE CARD ══ */
    .std-card{
      width:100%;
      aspect-ratio:4/5;
      background:linear-gradient(145deg, var(--g1), var(--g2));
      border-radius:24px;
      padding:28px 24px 22px;
      display:flex;
      flex-direction:column;
      position:relative;
      overflow:hidden;
      box-shadow:0 20px 50px rgba(13,20,66,.25);
      cursor:default;
      transition:transform .2s, box-shadow .2s;
    }
    .std-card:hover{transform:translateY(-4px);box-shadow:0 28px 60px rgba(13,20,66,.3);}

    /* خلفية زخرفية */
    .card-watermark{
      position:absolute;
      bottom:-20px; left:-10px;
      font-size:110px;font-weight:900;
      color:rgba(255,255,255,.05);
      line-height:1;
      pointer-events:none;
      font-family:'Tajawal',sans-serif;
      letter-spacing:-4px;
    }

    /* دوائر زخرفية */
    .std-card::before{
      content:"";position:absolute;
      top:-60px;left:-60px;
      width:200px;height:200px;
      background:rgba(255,255,255,.06);
      border-radius:50%;
      pointer-events:none;
    }
    .std-card::after{
      content:"";position:absolute;
      bottom:-40px;right:-40px;
      width:160px;height:160px;
      background:rgba(255,255,255,.05);
      border-radius:50%;
      pointer-events:none;
    }

    /* Logo row */
    .card-top{display:flex;align-items:center;gap:10px;margin-bottom:auto;}
    .card-logo{
      width:38px;height:38px;
      background:rgba(255,255,255,.15);
      border:1.5px solid rgba(255,255,255,.25);
      border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      font-size:17px;font-weight:800;color:#fff;
      flex-shrink:0;
    }
    .card-brand{display:flex;flex-direction:column;}
    .card-brand-main{font-size:14px;font-weight:700;color:#fff;line-height:1.2;}
    .card-brand-sub{font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.5px;}

    /* Save the Date badge */
    .card-badge{
      align-self:flex-start;
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.3);
      border-radius:20px;
      padding:5px 14px;
      font-size:11px;font-weight:700;
      color:rgba(255,255,255,.9);
      letter-spacing:1px;
      text-transform:uppercase;
      margin:20px 0 16px;
    }

    /* Program name */
    .card-prog-name{
      font-size:26px;font-weight:800;
      color:#fff;line-height:1.2;
      margin-bottom:4px;
      position:relative;z-index:1;
    }
    .card-prog-en{
      font-size:13px;color:rgba(255,255,255,.6);
      margin-bottom:24px;
      position:relative;z-index:1;
    }

    /* Date section */
    .card-date-wrap{
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.2);
      border-radius:14px;
      padding:14px 18px;
      position:relative;z-index:1;
    }
    .card-date-label{
      font-size:11px;font-weight:600;
      color:rgba(255,255,255,.65);
      letter-spacing:.5px;
      margin-bottom:4px;
    }
    .card-date-val{
      font-size:22px;font-weight:800;
      color:#fff;
    }
    .card-date-soon .card-date-val{font-size:20px;}

    /* Footer line */
    .card-footer-line{
      height:1px;background:rgba(255,255,255,.15);
      margin:18px 0 10px;position:relative;z-index:1;
    }
    .card-footer-text{
      font-size:11px;color:rgba(255,255,255,.45);
      text-align:center;position:relative;z-index:1;
      letter-spacing:.5px;
    }

    /* ── Action buttons ── */
    .card-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
    .act-btn{
      padding:8px 18px;border-radius:20px;border:none;
      font-family:'Tajawal',sans-serif;font-size:13px;font-weight:600;
      cursor:pointer;transition:.2s;
    }
    .export-btn{background:var(--navy);color:#fff;}
    .export-btn:hover{background:#002266;}
    .export-btn:disabled{opacity:.5;cursor:not-allowed;}
    .edit-btn-std{background:var(--blue);color:#fff;}
    .edit-btn-std:hover{background:#0a35d4;}
    .hide-btn{background:#fee2e2;color:#b91c1c;}
    .hide-btn:hover{background:#fecaca;}
    .show-btn{background:#d1fae5;color:#065f46;}
    .show-btn:hover{background:#a7f3d0;}

    /* ── Edit Modal ── */
    #edit-modal{
      display:none;position:fixed;inset:0;z-index:1000;
      background:rgba(0,10,35,.75);backdrop-filter:blur(6px);
      align-items:center;justify-content:center;
    }
    .edit-box{
      background:#fff;border-radius:20px;padding:32px;
      width:100%;max-width:380px;
      box-shadow:0 20px 60px rgba(0,0,0,.3);
    }
    .edit-box h3{font-size:17px;font-weight:700;color:var(--navy);margin-bottom:4px;}
    .edit-box .edit-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}
    .edit-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block;}
    .edit-input{
      width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;
      font-family:'Tajawal',sans-serif;font-size:14px;outline:none;direction:ltr;
      transition:.2s;
    }
    .edit-input:focus{border-color:var(--blue);}
    .edit-actions{display:flex;gap:10px;margin-top:20px;}
    .save-edit-btn{flex:1;padding:11px;background:var(--blue);color:#fff;border:none;
                   border-radius:10px;font-family:'Tajawal',sans-serif;font-size:14px;
                   font-weight:700;cursor:pointer;transition:.2s;}
    .save-edit-btn:hover{background:#0a35d4;}
    .clear-edit-btn{padding:11px 16px;background:#f5f5f5;border:1.5px solid #eee;
                    border-radius:10px;font-family:'Tajawal',sans-serif;font-size:13px;
                    font-weight:600;color:#999;cursor:pointer;transition:.2s;}
    .clear-edit-btn:hover{background:#fee2e2;color:#b91c1c;border-color:#fecaca;}
    .cancel-edit-btn{padding:11px 16px;background:transparent;border:1.5px solid var(--border);
                     border-radius:10px;font-family:'Tajawal',sans-serif;font-size:13px;
                     font-weight:600;color:var(--muted);cursor:pointer;}

    /* ── Login FAB ── */
    #login-fab{
      position:fixed;bottom:24px;left:24px;z-index:900;
      display:flex;
    }
    .fab-btn{
      width:44px;height:44px;background:var(--navy);color:rgba(255,255,255,.4);
      border:none;border-radius:50%;font-size:18px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 16px rgba(0,0,0,.2);transition:.2s;
    }
    .fab-btn:hover{color:#fff;}

    #login-popup{
      display:none;position:fixed;bottom:80px;left:24px;z-index:901;
      background:#fff;border-radius:16px;padding:20px;width:260px;
      box-shadow:0 10px 40px rgba(0,0,0,.2);
      flex-direction:column;gap:10px;
    }
    #login-popup p{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px;}
    .pop-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;
               font-family:'Tajawal',sans-serif;font-size:13px;outline:none;direction:ltr;}
    .pop-input:focus{border-color:var(--blue);}
    .pop-login-btn{width:100%;padding:10px;background:var(--blue);color:#fff;border:none;
                   border-radius:8px;font-family:'Tajawal',sans-serif;font-size:13px;
                   font-weight:700;cursor:pointer;}
    #fab-err{font-size:12px;color:#f44;min-height:16px;}

    /* ── Empty ── */
    .empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--muted);font-size:16px;}

    /* ── Toast ── */
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
           background:var(--navy);color:#fff;padding:12px 24px;border-radius:12px;
           font-size:14px;font-weight:600;opacity:0;transition:all .3s;
           pointer-events:none;z-index:9999;white-space:nowrap;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast.error{background:#c0392b;}

    @media(max-width:600px){
      header{padding:16px;}
      main{padding:24px 12px 60px;}
      #cards-grid{grid-template-columns:1fr;gap:20px;}
      .std-card{aspect-ratio:unset;min-height:300px;}
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo-mark">س</div>
  <div class="header-text">
    <h1>سلوكيرا — Save the Date</h1>
    <p>إعلانات البرامج الأكاديمية</p>
  </div>
  <nav class="header-nav">
    <a href="index.html" class="nav-link">← التقويم</a>
  </nav>
</header>

<!-- Admin bar -->
<div id="admin-bar">
  <span class="admin-label">⚙ وضع الأدمن</span>
  <button class="logout-btn" onclick="doLogout()">خروج</button>
</div>

<!-- Main -->
<main>
  <div class="page-intro">
    <h2>📅 Save the Date</h2>
    <p>إعلانات بداية البرامج الأكاديمية في سلوكيرا — احفظي البطاقة وشاركيها</p>
  </div>
  <div id="cards-grid">
    <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);">
      جاري التحميل...
    </div>
  </div>
</main>

<!-- Edit Modal -->
<div id="edit-modal" onclick="if(event.target===this)closeEdit()">
  <div class="edit-box">
    <h3>تعديل تاريخ البداية</h3>
    <p class="edit-sub" id="edit-prog-name"></p>
    <input type="hidden" id="edit-id"/>
    <label class="edit-label">تاريخ البداية</label>
    <input class="edit-input" type="date" id="edit-date-input" min="2026-01-01" max="2027-12-31"/>
    <div class="edit-actions">
      <button class="save-edit-btn" onclick="saveEdit()">حفظ</button>
      <button class="clear-edit-btn" onclick="clearDate()">مسح</button>
      <button class="cancel-edit-btn" onclick="closeEdit()">إلغاء</button>
    </div>
  </div>
</div>

<!-- Login FAB -->
<div id="login-fab">
  <button class="fab-btn" onclick="toggleLoginPopup()" title="دخول الأدمن">⚙</button>
</div>

<div id="login-popup">
  <p>دخول الأدمن</p>
  <input class="pop-input" type="email" id="fab-email" placeholder="البريد الإلكتروني"/>
  <input class="pop-input" type="password" id="fab-pass" placeholder="كلمة السر"/>
  <button class="pop-login-btn" onclick="doLogin()">دخول</button>
  <span id="fab-err"></span>
</div>

<div class="toast" id="toast"></div>

</body>
</html>
