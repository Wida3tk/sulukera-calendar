<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>التقويم الأكاديمي — سلوكيرا</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}:root{--navy:#001442;--blue:#0d40fc;--cyan:#55d7ff;--bg:#f3f6ff;--line:#dce4ff;--muted:#6b7694}body{margin:0;background:var(--bg);font-family:Tajawal,sans-serif;color:#111a32}header{background:linear-gradient(125deg,#001442,#062a7a);color:white;padding:22px 30px;display:flex;align-items:center;gap:15px}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));font-weight:900}.head h1{font-size:19px;margin:0}.head p{font-size:11px;color:var(--cyan);margin:2px 0 0}.nav{margin-right:auto;display:flex;gap:10px}.nav a{color:#fff;text-decoration:none;border:1px solid #ffffff2a;padding:8px 13px;border-radius:9px;font-size:12px}main{max-width:1180px;margin:auto;padding:40px 20px 70px}.hero{text-align:center;margin-bottom:34px}.hero h2{font-size:30px;color:var(--navy);margin:0 0 8px}.hero p{color:var(--muted);margin:0}.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:17px}.plan{background:#fff;border:1px solid var(--line);border-radius:21px;overflow:hidden;box-shadow:0 10px 32px #0014420b}.plan-head{background:linear-gradient(135deg,#001442,#07328a);color:#fff;padding:20px}.plan-head h3{margin:0 0 5px;font-size:18px}.plan-head p{margin:0;color:#b9c9f7;font-size:12px}.semesters{padding:15px;display:grid;gap:10px}.semester{border:1px solid var(--line);border-radius:13px;padding:12px}.semester h4{margin:0 0 8px;color:var(--navy)}.weeks{display:flex;gap:5px}.week{height:9px;flex:1;border-radius:10px;background:#0d40fc}.week.exam{background:#ff6b35}.week.break{background:#9c36e8}.week.course{background:#0ca678}.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:9px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px}.empty{text-align:center;background:#fff;border:1px dashed #b9c7ee;border-radius:20px;padding:60px 20px;color:var(--muted)}.empty b{display:block;color:var(--navy);font-size:19px;margin-bottom:7px}.holidays{margin-top:35px}.holidays h2{font-size:20px;color:var(--navy)}.holiday-row{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.holiday{flex:0 0 auto;border:1px solid #ffe08a;background:#fff8e1;color:#754800;border-radius:30px;padding:8px 13px;font-size:12px}footer{text-align:center;color:var(--muted);font-size:11px;padding:25px}@media(max-width:600px){header{padding:15px}.nav a:first-child{display:none}main{padding:28px 11px}.hero h2{font-size:24px}.plans{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="logo">س</div><div class="head"><h1>سلوكيرا — التقويم الأكاديمي</h1><p>ACADEMIC CALENDAR</p></div><nav class="nav"><a href="schedule.html">جداول المحاضرات</a><a href="planner.html">دخول الإدارة</a></nav></header>
<main><section class="hero"><h2>البرامج الأكاديمية</h2><p>النسخة الرسمية المعتمدة والمنشورة من الإدارة</p></section><section id="plans" class="plans"><div class="empty"><b>جاري تحميل البرامج…</b></div></section><section class="holidays"><h2>المناسبات والإجازات السعودية</h2><div id="holidays" class="holiday-row"></div></section></main>
<footer>© سلوكيرا — جميع الحقوق محفوظة</footer>
<script type="module">
  import {db} from "./js/firebase.js";import {collection,onSnapshot,query,where} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";import {SAUDI_EVENTS} from "./js/scheduler.js";
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const plansEl=document.getElementById("plans");
  function renderPlan(p){const groups=[];(p.blocks||[]).forEach(b=>{if(b.isSemesterBreak){groups.push({name:b.label,blocks:[b],breakOnly:true});return}const key=b.semesterName||b.unitNumber&&`الوحدة ${b.unitNumber}`||"الخطة";let group=groups.find(g=>g.name===key&&!g.breakOnly);if(!group){group={name:key,blocks:[]};groups.push(group)}group.blocks.push(b)});return `<article class="plan"><div class="plan-head"><h3>${esc(p.title)}</h3><p>${p.startDate} — ${p.endDate}</p></div><div class="semesters">${groups.map(g=>`<div class="semester"><h4>${esc(g.name)}</h4><div class="weeks">${g.blocks.map(b=>`<span class="week ${b.type}" title="${esc(b.label)}: ${b.start} — ${b.end}"></span>`).join("")}</div>${!g.breakOnly?`<div class="legend">${g.blocks.map(b=>`<span><i style="background:${b.type==='exam'?'#ff6b35':b.type==='course'?'#0ca678':'#0d40fc'}"></i>${esc(b.label)}</span>`).join("")}</div>`:""}</div>`).join("")}</div></article>`}
  onSnapshot(query(collection(db,"academic_plans"),where("visibleToStudents","==",true)),snap=>{const plans=snap.docs.map(d=>d.data()).filter(p=>p.status==="published").sort((a,b)=>a.startDate.localeCompare(b.startDate));plansEl.innerHTML=plans.length?plans.map(renderPlan).join(""):`<div class="empty"><b>لا توجد برامج منشورة حاليًا</b>ستظهر البرامج هنا بعد إنشائها واعتمادها من الإدارة.</div>`},()=>plansEl.innerHTML=`<div class="empty"><b>تعذر تحميل البرامج</b>راجعي صلاحيات Firestore للمجموعة الجديدة.</div>`);
  const today=new Date().toISOString().slice(0,10);document.getElementById("holidays").innerHTML=SAUDI_EVENTS.filter(e=>e.end>=today).map(e=>`<span class="holiday">${esc(e.name)} · ${e.start}${e.status==='tentative'?' (متوقع)':''}</span>`).join("");
</script></body></html>
