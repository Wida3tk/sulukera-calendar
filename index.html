<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>التقويم الأكاديمي — سلوكيرا</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --navy: #001442;
        --blue: #0d40fc;
        --cyan: #55d7ff;
        --bg: #f3f6ff;
        --line: #dce4ff;
        --muted: #6b7694;
      }
      body {
        margin: 0;
        background: var(--bg);
        font-family: Tajawal, sans-serif;
        color: #111a32;
      }
      header {
        background: linear-gradient(125deg, #001442, #062a7a);
        color: #fff;
        padding: 20px 28px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--blue), var(--cyan));
        font-weight: 900;
      }
      .head h1 {
        font-size: 19px;
        margin: 0;
      }
      .head p {
        font-size: 11px;
        color: var(--cyan);
        margin: 2px 0 0;
      }
      .nav {
        margin-right: auto;
        display: flex;
        gap: 9px;
      }
      .nav a {
        color: #fff;
        text-decoration: none;
        border: 1px solid #ffffff2a;
        padding: 8px 12px;
        border-radius: 9px;
        font-size: 12px;
      }
      main {
        max-width: 1300px;
        margin: auto;
        padding: 34px 18px 70px;
      }
      .hero {
        text-align: center;
        margin-bottom: 28px;
      }
      .hero h2 {
        font-size: 29px;
        color: var(--navy);
        margin: 0 0 7px;
      }
      .hero p {
        color: var(--muted);
        margin: 0;
      }
      .tabs {
        display: flex;
        gap: 7px;
        overflow: auto;
        margin-bottom: 16px;
        padding-bottom: 5px;
      }
      .tab {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        padding: 9px 16px;
        border-radius: 25px;
        white-space: nowrap;
        cursor: pointer;
      }
      .tab.active {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .plan-info {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px 19px;
        margin-bottom: 10px;
      }
      .plan-info h3 {
        margin: 0 0 4px;
        color: var(--navy);
      }
      .plan-info p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .color-legend {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px 16px;
        margin-bottom: 17px;
      }
      .color-legend h4 {
        margin: 0 0 9px;
        font-size: 12px;
        color: var(--muted);
      }
      .key {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 11px;
        color: #35405e;
      }
      .key-item {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 7px 11px;
        background: #fff;
        cursor: pointer;
        font-family: inherit;
      }
      .key-item:hover,
      .key-item.active {
        border-color: var(--event-color);
        box-shadow: 0 0 0 2px
          color-mix(in srgb, var(--event-color) 20%, transparent);
      }
      .key-item.active {
        background: color-mix(in srgb, var(--event-color) 10%, white);
        font-weight: 800;
      }
      .key-item i {
        display: inline-block;
        width: 13px;
        height: 13px;
        border-radius: 4px;
        background: var(--event-color);
      }
      .months {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .month {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 17px;
        padding: 14px;
        box-shadow: 0 7px 24px #00144209;
      }
      .month h3 {
        margin: 0 0 11px;
        text-align: center;
        color: var(--navy);
        font-size: 16px;
      }
      .dow,
      .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
      }
      .dow span {
        text-align: center;
        font-size: 10px;
        color: var(--muted);
        font-weight: 700;
        padding-bottom: 5px;
      }
      .day {
        min-height: 62px;
        border: 1px solid #edf0fa;
        border-radius: 9px;
        padding: 5px;
        position: relative;
        transition:
          transform 0.18s,
          box-shadow 0.18s,
          border-color 0.18s;
        cursor: default;
        background: #fff;
        font-family: inherit;
        text-align: right;
        color: inherit;
        width: 100%;
      }
      .day.empty-day {
        border-color: transparent;
        background: transparent;
      }
      .day.has-event {
        background: color-mix(in srgb, var(--cell-color) 13%, white);
        border-color: color-mix(in srgb, var(--cell-color) 32%, white);
        cursor: pointer;
      }
      .day.has-event:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 18px
          color-mix(in srgb, var(--cell-color) 25%, transparent);
        border-color: var(--cell-color);
        z-index: 5;
      }
      .day.start-day {
        border-right: 4px solid var(--cell-color);
      }
      .day.end-day {
        border-left: 4px solid var(--cell-color);
      }
      .num {
        font-size: 11px;
        font-weight: 800;
        color: #59647f;
      }
      .today {
        box-shadow: inset 0 0 0 2px var(--blue);
      }
      .week-tag {
        display: block;
        margin-top: 8px;
        font-size: 9px;
        font-weight: 800;
        color: color-mix(in srgb, var(--cell-color) 75%, #001442);
        line-height: 1.3;
      }
      .day-more {
        position: absolute;
        left: 4px;
        bottom: 3px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f5b700;
      }
      .detail-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: #00144255;
        z-index: 200;
        backdrop-filter: blur(3px);
      }
      .detail-backdrop.show {
        display: block;
      }
      .detail-card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #fff;
        border-radius: 20px;
        width: min(420px, calc(100% - 28px));
        padding: 22px;
        box-shadow: 0 25px 80px #00144266;
      }
      .detail-close {
        position: absolute;
        left: 14px;
        top: 14px;
        border: 0;
        background: #edf1ff;
        color: var(--navy);
        width: 32px;
        height: 32px;
        border-radius: 9px;
        cursor: pointer;
      }
      .detail-date {
        color: var(--blue);
        font-weight: 900;
        margin-bottom: 14px;
      }
      .detail-item {
        border-right: 5px solid var(--detail-color);
        background: color-mix(in srgb, var(--detail-color) 9%, white);
        padding: 12px 14px;
        border-radius: 10px;
        margin-top: 9px;
      }
      .detail-item h4 {
        margin: 0 0 5px;
        color: var(--navy);
      }
      .detail-item p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      .empty {
        background: #fff;
        border: 1px dashed #b9c7ee;
        border-radius: 20px;
        padding: 60px;
        text-align: center;
        color: var(--muted);
      }
      .empty b {
        display: block;
        color: var(--navy);
        font-size: 18px;
      }
      .holidays {
        margin-top: 30px;
      }
      .holiday-row {
        display: flex;
        gap: 8px;
        overflow: visible;
        flex-wrap: wrap;
      }
      .holiday-pill {
        position: relative;
        flex: 0 0 auto;
        background: #f5b700;
        color: #3c2a00;
        border-radius: 25px;
        padding: 8px 12px;
        font-size: 11px;
        cursor: help;
      }
      .holiday-pill[data-tooltip]:hover::after {
        content: attr(data-tooltip);
        position: absolute;
        z-index: 100;
        right: 50%;
        bottom: calc(100% + 8px);
        transform: translateX(50%);
        width: max-content;
        max-width: 240px;
        white-space: pre-line;
        text-align: right;
        background: #001442;
        color: #fff;
        padding: 9px 11px;
        border-radius: 9px;
        font-size: 11px;
        line-height: 1.6;
        box-shadow: 0 8px 24px #00144255;
        pointer-events: none;
      }
      footer {
        text-align: center;
        color: var(--muted);
        font-size: 11px;
        padding: 22px;
      }
      @media (max-width: 1050px) {
        .months {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 680px) {
        header {
          padding: 14px;
        }
        .nav a:first-child {
          display: none;
        }
        main {
          padding: 25px 8px;
        }
        .months {
          grid-template-columns: 1fr;
        }
        .day {
          min-height: 58px;
        }
        .hero h2 {
          font-size: 23px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">س</div>
      <div class="head">
        <h1>سلوكيرا — التقويم الأكاديمي</h1>
        <p>ACADEMIC CALENDAR</p>
      </div>
      <nav class="nav">
        <a href="schedule.html">الجداول</a
        ><a href="planner.html">دخول الإدارة</a>
      </nav>
    </header>
    <main>
      <section class="hero">
        <h2>التقويم الأكاديمي</h2>
        <p>تواريخ بداية ونهاية الفصول والاختبارات والإجازات</p>
      </section>
      <div id="app">
        <div class="empty"><b>جاري تحميل البرامج…</b></div>
      </div>
      <section class="holidays">
        <h2>الإجازات الرسمية</h2>
        <div id="holidays" class="holiday-row"></div>
      </section>
    </main>
    <div id="detail" class="detail-backdrop">
      <div class="detail-card">
        <button id="detail-close" class="detail-close">×</button>
        <div id="detail-content"></div>
      </div>
    </div>
    <footer>© سلوكيرا — جميع الحقوق محفوظة</footer>
    <script type="module">
      import { db } from "./js/firebase.js";
      import {
        collection,
        onSnapshot,
        query,
        where,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
      import { SAUDI_EVENTS, parseDate, formatDate } from "./js/scheduler.js";
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      let plans = [],
        active = 0,
        activeFilter = "all",
        currentMap = {};
      const app = document.getElementById("app"),
        monthsAr = [
          "يناير",
          "فبراير",
          "مارس",
          "أبريل",
          "مايو",
          "يونيو",
          "يوليو",
          "أغسطس",
          "سبتمبر",
          "أكتوبر",
          "نوفمبر",
          "ديسمبر",
        ],
        daysAr = ["ح", "ن", "ث", "ر", "خ", "ج", "س"];
      const palette = [
          "#2563eb",
          "#7c3aed",
          "#db2777",
          "#0891b2",
          "#16a34a",
          "#ea580c",
          "#4f46e5",
          "#be123c",
        ],
        holidayColor = "#f5b700";
      function datesBetween(a, b) {
        const out = [],
          d = parseDate(a),
          end = parseDate(b);
        while (d <= end) {
          out.push(formatDate(d));
          d.setDate(d.getDate() + 1);
        }
        return out;
      }
      function monthKey(d) {
        return d.slice(0, 7);
      }
      function colorGroups(p) {
        const names = [];
        (p.blocks || [])
          .filter((b) => !b.isSemesterBreak)
          .forEach((b) => {
            const name =
              b.semesterName ||
              (b.unitNumber ? `الوحدة ${b.unitNumber}` : b.label);
            if (!names.includes(name)) names.push(name);
          });
        return Object.fromEntries(
          names.map((name, i) => [name, palette[i % palette.length]]),
        );
      }
      function render() {
        if (!plans.length) {
          app.innerHTML =
            '<div class="empty"><b>لا توجد برامج منشورة حاليًا</b>ستظهر البرامج بعد اعتمادها من الإدارة.</div>';
          return;
        }
        active = Math.min(active, plans.length - 1);
        const p = plans[active],
          map = {},
          colors = colorGroups(p),
          blocks = p.blocks || [],
          groupKey = (b) =>
            b.isSemesterBreak
              ? `break-${b.id}`
              : b.semesterName ||
                (b.unitNumber && `unit-${b.unitNumber}`) ||
                b.label;
        blocks.forEach((b, i) => {
          const key = groupKey(b),
            name =
              b.semesterName ||
              (b.unitNumber ? `الوحدة ${b.unitNumber}` : b.label),
            color = b.isSemesterBreak ? "#a855f7" : colors[name],
            filter = b.isSemesterBreak ? "break" : name,
            groupStart = i === 0 || groupKey(blocks[i - 1]) !== key,
            groupEnd =
              i === blocks.length - 1 || groupKey(blocks[i + 1]) !== key;
          datesBetween(b.start, b.end).forEach((date) =>
            (map[date] ??= []).push({
              ...b,
              name,
              color,
              filter,
              isStart: groupStart && date === b.start,
              isEnd: groupEnd && date === b.end,
            }),
          );
        });
        SAUDI_EVENTS.filter(
          (e) => e.end >= p.startDate && e.start <= p.endDate,
        ).forEach((e) =>
          datesBetween(e.start, e.end).forEach((date) =>
            (map[date] ??= []).push({
              type: "holiday",
              name: e.name,
              label: e.name,
              color: holidayColor,
              filter: "official",
              start: e.start,
              end: e.end,
              status: e.status,
              isStart: date === e.start,
              isEnd: date === e.end,
            }),
          ),
        );
        currentMap = map;
        const keys = [];
        let d = parseDate(p.startDate),
          end = parseDate(p.endDate);
        while (d <= end) {
          const k = monthKey(formatDate(d));
          if (!keys.includes(k)) keys.push(k);
          d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
        }
        const item = (name, color, filter) =>
            `<button class="key-item ${activeFilter === filter ? "active" : ""}" data-filter="${esc(filter)}" style="--event-color:${color}"><i></i>${esc(name)}</button>`,
          legend =
            item("عرض الكل", "#001442", "all") +
            Object.entries(colors)
              .map(([name, color]) => item(name, color, name))
              .join("") +
            item("إجازة بين الفصول", "#a855f7", "break") +
            item("إجازة رسمية", holidayColor, "official");
        app.innerHTML = `<div class="tabs">${plans.map((x, i) => `<button class="tab ${i === active ? "active" : ""}" data-tab="${i}">${esc(x.title)}</button>`).join("")}</div><div class="plan-info"><div><h3>${esc(p.title)}</h3><p>يبدأ ${p.startDate} · ينتهي ${p.endDate}</p></div></div><div class="color-legend"><h4>اختاري فصلًا لعرض تواريخه فقط، واضغطي على أي يوم ملوّن لعرض التفاصيل</h4><div class="key">${legend}</div></div><div class="months">${keys.map((k) => renderMonth(k, map)).join("")}</div>`;
        document.querySelectorAll("[data-tab]").forEach(
          (b) =>
            (b.onclick = () => {
              active = Number(b.dataset.tab);
              activeFilter = "all";
              render();
            }),
        );
        document.querySelectorAll("[data-filter]").forEach(
          (b) =>
            (b.onclick = () => {
              activeFilter = b.dataset.filter;
              render();
            }),
        );
        document
          .querySelectorAll("[data-date]")
          .forEach((b) => (b.onclick = () => openDay(b.dataset.date)));
      }
      function typeLabel(e) {
        return e.type === "study"
          ? "أسبوع دراسي"
          : e.type === "exam"
            ? "أسبوع الاختبارات"
            : e.type === "break"
              ? "إجازة الفصل"
              : e.type === "course"
                ? "وحدة دراسية"
                : "إجازة رسمية";
      }
      function renderMonth(k, map) {
        const [y, m] = k.split("-").map(Number),
          fd = new Date(y, m - 1, 1).getDay(),
          dim = new Date(y, m, 0).getDate();
        let cells = '<div class="day empty-day"></div>'.repeat(fd);
        for (let n = 1; n <= dim; n++) {
          const ds = `${y}-${String(m).padStart(2, "0")}-${String(n).padStart(2, "0")}`,
            events = (map[ds] || []).filter(
              (e) => activeFilter === "all" || e.filter === activeFilter,
            ),
            primary = events.find((e) => e.type !== "holiday") || events[0],
            today = ds === new Date().toISOString().slice(0, 10),
            starts = events.some((e) => e.isStart),
            ends = events.some((e) => e.isEnd),
            tag =
              primary && primary.start === ds
                ? primary.weekInSemester || primary.isSemesterBreak
                  ? `الأسبوع ${primary.weekInSemester || 6} · ${typeLabel(primary)}`
                  : typeLabel(primary)
                : "",
            holiday = events.some((e) => e.type === "holiday");
          cells += events.length
            ? `<button type="button" class="day has-event ${today ? "today" : ""} ${starts ? "start-day" : ""} ${ends ? "end-day" : ""}" data-date="${ds}" style="--cell-color:${primary.color}" aria-label="تفاصيل ${ds}"><span class="num">${n}</span>${tag ? `<span class="week-tag">${esc(tag)}</span>` : ""}${holiday ? '<span class="day-more" title="إجازة رسمية"></span>' : ""}</button>`
            : `<div class="day ${today ? "today" : ""}"><span class="num">${n}</span></div>`;
        }
        return `<section class="month"><h3>${monthsAr[m - 1]} ${y}</h3><div class="dow">${daysAr.map((x) => `<span>${x}</span>`).join("")}</div><div class="days">${cells}</div></section>`;
      }
      const detail = document.getElementById("detail"),
        detailContent = document.getElementById("detail-content");
      function openDay(date) {
        const events = (currentMap[date] || []).filter(
          (e) => activeFilter === "all" || e.filter === activeFilter,
        );
        if (!events.length) return;
        const title = new Intl.DateTimeFormat("ar-SA", {
          dateStyle: "full",
        }).format(parseDate(date));
        detailContent.innerHTML = `<div class="detail-date">${esc(title)}</div>${events
          .map(
            (e) =>
              `<article class="detail-item" style="--detail-color:${e.color}"><h4>${esc(e.name)}</h4><p>${esc(typeLabel(e))}${e.weekInSemester || e.isSemesterBreak ? ` · الأسبوع ${e.weekInSemester || 6}` : ""}<br>${esc(e.start)} — ${esc(e.end)}${e.status === "tentative" ? "<br>التاريخ متوقع" : ""}</p></article>`,
          )
          .join("")}`;
        detail.classList.add("show");
      }
      function closeDetail() {
        detail.classList.remove("show");
      }
      document.getElementById("detail-close").onclick = closeDetail;
      detail.onclick = (e) => {
        if (e.target === detail) closeDetail();
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDetail();
      });
      onSnapshot(
        query(
          collection(db, "academic_plans"),
          where("visibleToStudents", "==", true),
        ),
        (snap) => {
          plans = snap.docs
            .map((d) => d.data())
            .filter((p) => p.status === "published")
            .sort((a, b) => a.startDate.localeCompare(b.startDate));
          render();
        },
        () =>
          (app.innerHTML =
            '<div class="empty"><b>تعذر تحميل التقويم</b>راجعي الاتصال.</div>'),
      );
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById("holidays").innerHTML = SAUDI_EVENTS.filter(
        (e) => e.end >= today,
      )
        .map((e) => {
          const detail = `${e.name}\n${e.start}${e.end !== e.start ? " — " + e.end : ""}\n${e.status === "tentative" ? "متوقع — بانتظار الإعلان الرسمي" : "تاريخ مؤكد"}`;
          return `<span class="holiday-pill" data-tooltip="${esc(detail)}">${esc(e.name)} · ${e.start}${e.status === "tentative" ? " (متوقع)" : ""}</span>`;
        })
        .join("");
    </script>
  </body>
</html>
