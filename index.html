    const MONTHS_AR = ["يناير","فبراير","مارس","أبريل","مايو","يونيو",
                       "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
    const DAYS_AR   = ["ح","ن","ث","ر","خ","ج","س"];

    // حالة التطبيق
    let currentYear       = 2026;
    let activeProgram     = null;
    let firebaseData      = {};  // بيانات Firebase (visible, notes, events_2027)

    // ═══════════════════════════════════════════
    // Firebase listener
    // ═══════════════════════════════════════════
    window.addEventListener("DOMContentLoaded", () => {
      onSnapshot(collection(db, "calendars"), snap => {
        firebaseData = {};
        snap.forEach(d => { firebaseData[d.id] = d.data(); });
        render();
      }, err => {
        document.getElementById("loading").innerHTML =
          `<p style="color:#f44">خطأ في تحميل البيانات</p>`;
      });
    });

    // ═══════════════════════════════════════════
    // Render
    // ═══════════════════════════════════════════
    function render() {
      const loading   = document.getElementById("loading");
      const container = document.getElementById("programs-container");
      loading.style.display = "none";

      // البرامج الظاهرة فقط
      const visible = Object.keys(PROGRAMS_META).filter(id => firebaseData[id]?.visible);

      if (visible.length === 0) {
        container.innerHTML = `<div class="empty-state">
          <div class="empty-icon">📅</div>
          <p>لا توجد برامج متاحة حالياً</p>
          <p class="empty-sub">سيتم الإعلان عن المواعيد قريباً</p>
        </div>`;
        return;
      }

      // أول برنامج ظاهر افتراضياً
      if (!activeProgram || !visible.includes(activeProgram)) {
        activeProgram = visible[0];
      }

      // ── Tabs برامج ──
      let html = `<div class="tabs-wrapper"><div class="tabs">`;
      for (const id of visible) {
        const name = PROGRAMS_META[id]?.nameAr || id;
        html += `<button class="tab ${id===activeProgram?"active":""}"
          onclick="switchProgram('${id}')">${name}</button>`;
      }
      html += `</div></div>`;

      // ── محتوى البرنامج النشط ──
      html += buildProgramPanel(activeProgram);

      container.innerHTML = html;
    }

    window.switchProgram = id => {
      activeProgram = id;
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    };

    window.switchYear = yr => {
      currentYear = yr;
      document.querySelectorAll(".yr-btn").forEach(b =>
        b.classList.toggle("active", +b.dataset.yr === yr));
      const panel = document.getElementById("cal-panel");
      if (panel) panel.innerHTML = buildCalendarHTML();
    };

    function buildProgramPanel(id) {
      const meta   = PROGRAMS_META[id] || {};
      const fbData = firebaseData[id]  || {};
      const notes  = fbData.notes      || "";
      const legend = meta.legend       || [];

      // أحداث: 2026 من الكود، 2027 من Firebase
      const events2026 = EVENTS_2026[id] || {};
      const events2027 = fbData.events_2027 || {};
      const events     = currentYear === 2026 ? events2026 : events2027;

      // legend html
      let legendHtml = "";
      if (legend.length) {
        legendHtml = `<div class="legend">` +
          legend.map(l => `<div class="legend-item">
            <span class="legend-dot" style="background:${l.color}"></span>
            <span>${l.label}</span>
          </div>`).join("") +
          `</div>`;
      }

      return `
        <div class="program-panel">
          <div class="panel-top">
            ${legendHtml}
            <div class="panel-controls">
              <div class="yr-switcher">
                <button class="yr-btn ${currentYear===2026?"active":""}" data-yr="2026"
                  onclick="switchYear(2026)">2026</button>
                <button class="yr-btn ${currentYear===2027?"active":""}" data-yr="2027"
                  onclick="switchYear(2027)">2027</button>
              </div>
              <button class="pdf-btn" onclick="exportPDF('${id}')">
                ⬇ تصدير PDF
              </button>
            </div>
          </div>
          <div id="cal-panel">${buildCalendarHTML(id, events)}</div>
          ${notes ? `<div class="notes-box"><span class="notes-label">ملاحظات:</span> ${notes}</div>` : ""}
        </div>`;
    }

    function buildCalendarHTML(id, eventsOverride) {
      const progId = id || activeProgram;
      const fbData = firebaseData[progId] || {};
      let events;
      if (eventsOverride !== undefined) {
        events = eventsOverride;
      } else {
        events = currentYear === 2026
          ? (EVENTS_2026[progId] || {})
          : (fbData.events_2027 || {});
      }

      const yr  = currentYear;
      const now = new Date();

      let html = `<div class="year-grid">`;
      for (let m = 0; m < 12; m++) {
        const fd  = new Date(yr, m, 1).getDay();
        const dim = new Date(yr, m+1, 0).getDate();
        html += `<div class="month-card">
          <div class="month-name">${MONTHS_AR[m]}</div>
          <div class="days-header">`;
        DAYS_AR.forEach(d => { html += `<span>${d}</span>`; });
        html += `</div><div class="days-grid">`;
        for (let i=0; i<fd; i++) html += `<span></span>`;
        for (let d=1; d<=dim; d++) {
          const ds      = `${yr}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
          const type    = events[ds] || "";
          const isToday = now.getFullYear()===yr && now.getMonth()===m && now.getDate()===d;
          html += `<span class="day ${type} ${isToday?"today":""}">${d}</span>`;
        }
        html += `</div></div>`;
      }
      html += `</div>`;
      return html;
    }

    // ═══════════════════════════════════════════

    // ═══════════════════════════════════════════

      const meta = PROGRAMS_META[progId] || {};
      const name = meta.nameAr || progId;

      btn.disabled = true;
      btn.textContent = "⏳ جاري التصدير...";

      try {
        const { jsPDF } = window.jspdf;

        const fbData = firebaseData[progId] || {};
        const events = currentYear === 2026
          ? (EVENTS_2026[progId] || {})
          : (fbData.events_2027 || {});

        const legend = meta.legend || [];

        // A4 landscape = 297×210mm → عند 96dpi ≈ 1122×794px
        // نجعل printDiv عرض 1100px ثابت لضمان صفحة واحدة
        const printDiv = document.createElement("div");
        printDiv.style.cssText = `
          position:fixed;
          top:0; left:0;
          width:1122px;
          min-height:794px;
          background:#fff;
          padding:28px 32px 24px;
          font-family:'Tajawal',sans-serif;
          direction:rtl;
          box-sizing:border-box;
          overflow:hidden;
        `;

        // ── Header ──
        printDiv.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;
            margin-bottom:14px;padding-bottom:12px;border-bottom:3px solid #0D40FC;">
            <div>
              <div style="font-size:20px;font-weight:800;color:#001442;margin-bottom:2px;">
                سلوكيرا – التقويم الأكاديمي ${currentYear}
              </div>
              <div style="font-size:13px;color:#6b7a9a;">${name}</div>
            </div>
            <div style="width:52px;height:52px;
              background:linear-gradient(135deg,#0D40FC,#55D7FF);
              border-radius:14px;display:flex;align-items:center;justify-content:center;
              font-size:24px;font-weight:800;color:#fff;flex-shrink:0;">س</div>
          </div>

          <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;align-items:center;">
            ${legend.map(l=>`
              <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:#444;">
                <span style="width:14px;height:14px;border-radius:4px;
                  background:${l.color};display:inline-block;flex-shrink:0;"></span>
                ${l.label}
              </div>`).join("")}
          </div>

          <div id="pdf-months-grid"
            style="display:grid;grid-template-columns:repeat(6,1fr);
              grid-template-rows:repeat(2,1fr);gap:10px;flex:1;">
            ${buildPrintCalendar(events, currentYear)}
          </div>

          <div style="margin-top:12px;text-align:center;font-size:10px;color:#bbb;">
            sulukera.com — جميع الحقوق محفوظة © ${currentYear}
          </div>`;

        // إخفاء عن المستخدم أثناء التقاط
        printDiv.style.visibility = "hidden";
        document.body.appendChild(printDiv);

        // انتظر تحميل الخطوط
        await document.fonts.ready;
        await new Promise(r => setTimeout(r, 300));

        printDiv.style.visibility = "visible";

        const canvas = await html2canvas(printDiv, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: "#ffffff",
          logging: false,
          width:  1122,
          height: printDiv.scrollHeight,
          windowWidth: 1122,
        });

        document.body.removeChild(printDiv);

        const { jsPDF: PDF } = window.jspdf;
        const pdf   = new PDF({ orientation: "landscape", unit: "mm", format: "a4" });
        const pageW = pdf.internal.pageSize.getWidth();   // 297mm
        const pageH = pdf.internal.pageSize.getHeight();  // 210mm

        // ضغط الصورة لتناسب الصفحة بدون قطع
        const imgW   = canvas.width;
        const imgH   = canvas.height;
        const scale  = Math.min(pageW / (imgW / 2), pageH / (imgH / 2));
        const finalW = (imgW / 2) * scale;
        const finalH = (imgH / 2) * scale;
        const offX   = (pageW - finalW) / 2;
        const offY   = (pageH - finalH) / 2;

        pdf.addImage(canvas.toDataURL("image/png","1.0"), "PNG",
          offX, offY, finalW, finalH);

        pdf.save(`sulukera-${progId}-${currentYear}.pdf`);

      } catch (e) {
        console.error(e);
        alert("حدث خطأ أثناء التصدير: " + e.message);
      }

      btn.disabled = false;
      btn.textContent = "⬇ تصدير PDF";
    };

    function buildPrintCalendar(events, yr) {
      // الأشهر بالترتيب الصحيح: يناير → ديسمبر (من اليمين لليسار في grid)
      // grid-template-columns: repeat(6,1fr) → صفان × ٦ أعمدة = ١٢ شهر
      const TYPE_COLORS = {
        study:   "#ddeeff",
        exam:    "#FF6B35",
        break:   "#A8E6CF",
        holiday: "#FFD93D",
        obm:     "#0D40FC",
      };
      const TYPE_TEXT = {
        study: "#0D40FC", exam: "#fff", break: "#1a5c3a",
        holiday: "#7a4f00", obm: "#fff",
      };

      let html = "";
      for (let m = 0; m < 12; m++) {
        const fd  = new Date(yr, m, 1).getDay();
        const dim = new Date(yr, m+1, 0).getDate();

        // حجم الخلية: عرض الشهر ≈ (1122-64-50)/6 ≈ 168px
        // ارتفاع الشهر للصف الواحد: max 6 أسابيع × 22px + header
        html += `
        <div style="background:#f8faff;border:1px solid #dde5ff;border-radius:10px;
          padding:8px 6px;display:flex;flex-direction:column;">
          <div style="font-size:13px;font-weight:700;color:#001442;
            text-align:center;margin-bottom:6px;">${MONTHS_AR[m]}</div>

          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:2px;">
            ${["ح","ن","ث","ر","خ","ج","س"].map(d=>
              `<span style="text-align:center;font-size:9px;font-weight:700;
                color:#8899bb;padding:1px 0;">${d}</span>`
            ).join("")}
          </div>

          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;flex:1;">
            ${Array(fd).fill(`<span></span>`).join("")}
            ${Array.from({length:dim},(_,i)=>{
              const d    = i+1;
              const ds   = `${yr}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
              const type = events[ds] || "";
              const bg   = TYPE_COLORS[type] || "transparent";
              const tc   = TYPE_TEXT[type]   || "#222";
              const fw   = type ? "700" : "400";
              return `<span style="
                display:flex;align-items:center;justify-content:center;
                aspect-ratio:1;font-size:10px;font-weight:${fw};
                border-radius:5px;
                background-color:${bg};
                color:${tc};
                -webkit-print-color-adjust:exact;
                print-color-adjust:exact;
              ">${d}</span>`;
            }).join("")}
          </div>
        </div>`;
      }
      return html;
    }
  </script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --blue:#0D40FC;--cyan:#55D7FF;--navy:#001442;
      --bg:#f4f7ff;--card:#fff;--text:#0a1628;
      --muted:#6b7a9a;--border:#e0e8ff;--r:16px;
    }
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;}

    /* Header */
    header{background:var(--navy);padding:24px 32px;display:flex;align-items:center;gap:16px;}
    .logo-mark{width:44px;height:44px;background:linear-gradient(135deg,var(--blue),var(--cyan));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0;}
    .header-text h1{font-size:20px;font-weight:700;color:#fff;}
    .header-text p{font-size:13px;color:var(--cyan);margin-top:2px;}
    .header-admin-link{margin-right:auto;color:rgba(255,255,255,.3);text-decoration:none;font-size:13px;transition:.2s;}
    .header-admin-link:hover{color:rgba(255,255,255,.7);}

    /* Loading */
    #loading{display:flex;align-items:center;justify-content:center;min-height:300px;flex-direction:column;gap:12px;}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* Main */
    main{max-width:1200px;margin:0 auto;padding:32px 20px 60px;}

    /* Program tabs */
    .tabs-wrapper{overflow-x:auto;margin-bottom:24px;}
    .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px;width:fit-content;min-width:100%;}
    .tab{padding:10px 22px;border:none;background:transparent;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;transition:.2s;white-space:nowrap;}
    .tab:hover{background:var(--bg);color:var(--text);}
    .tab.active{background:var(--blue);color:#fff;font-weight:700;}

    /* Panel top controls */
    .panel-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
    .legend{display:flex;flex-wrap:wrap;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;}
    .legend-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
    .legend-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0;}

    .panel-controls{display:flex;align-items:center;gap:10px;flex-shrink:0;}

    /* Year switcher */
    .yr-switcher{display:flex;background:var(--card);border:1.5px solid var(--border);border-radius:10px;overflow:hidden;}
    .yr-btn{padding:9px 18px;border:none;background:transparent;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:.2s;}
    .yr-btn:hover{background:var(--bg);}
    .yr-btn.active{background:var(--blue);color:#fff;}

    /* PDF button */
    .pdf-btn{padding:9px 18px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;white-space:nowrap;}
    .pdf-btn:hover{background:#002266;}
    .pdf-btn:disabled{opacity:.6;cursor:not-allowed;}

    /* Calendar grid */
    .year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
    .month-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;transition:box-shadow .2s;}
    .month-card:hover{box-shadow:0 4px 20px rgba(13,64,252,.08);}
    .month-name{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:12px;text-align:center;}
    .days-header{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
    .days-header span{text-align:center;font-size:10px;font-weight:600;color:var(--muted);padding:3px 0;}
    .days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
    .day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;border-radius:7px;color:var(--text);transition:transform .1s;cursor:default;}
    .day:hover{transform:scale(1.15);z-index:1;position:relative;}
    .day.study  {background:#ddeeff;color:#0D40FC;}
    .day.exam   {background:#FF6B35;color:#fff;font-weight:700;}
    .day.break  {background:#A8E6CF;color:#1a5c3a;}
    .day.holiday{background:#FFD93D;color:#7a4f00;}
    .day.obm    {background:#0D40FC;color:#fff;font-weight:700;}
    .day.today  {box-shadow:0 0 0 2px var(--blue);font-weight:700;}

    /* Notes */
    .notes-box{margin-top:20px;background:#fff8e1;border:1px solid #ffe082;border-radius:12px;padding:14px 18px;font-size:13px;color:#6d4c00;}
    .notes-label{font-weight:700;margin-left:6px;}

    /* Empty */
    .empty-state{text-align:center;padding:80px 20px;}
    .empty-icon{font-size:52px;margin-bottom:16px;}
    .empty-state p{font-size:17px;font-weight:600;color:var(--text);}
    .empty-sub{font-size:14px!important;font-weight:400!important;color:var(--muted)!important;margin-top:6px;}

    /* Footer */
    footer{text-align:center;padding:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);}

    @media(max-width:600px){
      header{padding:18px 16px;}
      main{padding:20px 12px 40px;}
      .year-grid{grid-template-columns:1fr 1fr;gap:8px;}
      .month-card{padding:10px 8px;}
      .panel-top{flex-direction:column;}
      .panel-controls{width:100%;justify-content:space-between;}
    }
  </style>
</head>

  </div>

</main>

</body>
