    // ═══════════════════════════════════════════
    // البحث عن فصل لتاريخ معين
    // ═══════════════════════════════════════════
    function getPhaseLabel(dateStr, phases) {
      if (!phases || !phases.length) return "";
      for (const ph of phases) {
        if (!ph.label) continue;
        // فصل بنطاق
        if (ph.from && ph.to) {
          if (dateStr >= ph.from && dateStr <= ph.to) return ph.label;
        }
        // يوم واحد (start date)
        if (ph.from && !ph.to && dateStr === ph.from) return ph.label;
      }
      return "";
    }

          try {
            const { setDoc, doc: firestoreDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
            await setDoc(firestoreDoc(db,"calendars",progId), { events: EVENTS_2026[progId] }, { merge: true });
          } catch(e) { console.warn("migration failed for", progId, e); }
        }
      }

      onSnapshot(collection(db, "calendars"), snap => {
        firebaseData = {};
        snap.forEach(d => {
          firebaseData[d.id] = d.data();
          // migration في الخلفية
          migrateEventsIfNeeded(d.id, d.data());
        });
        render();
      }, err => {
        document.getElementById("loading").innerHTML =
          `<p style="color:#f44">خطأ في تحميل البيانات</p>`;
      });
    });

    // ═══════════════════════════════════════════
    // Render
    // ═══════════════════════════════════════════
    function render() {
      const loading   = document.getElementById("loading");
      const container = document.getElementById("programs-container");
      loading.style.display = "none";

      // البرامج الظاهرة فقط
      const visible = Object.keys(PROGRAMS_META).filter(id => firebaseData[id]?.visible);

      if (visible.length === 0) {
        container.innerHTML = `<div class="empty-state">
          <div class="empty-icon">📅</div>
          <p>لا توجد برامج متاحة حالياً</p>
          <p class="empty-sub">سيتم الإعلان عن المواعيد قريباً</p>
        </div>`;
        return;
      }

      // أول برنامج ظاهر افتراضياً
      if (!activeProgram || !visible.includes(activeProgram)) {
        activeProgram = visible[0];
      }

      // ── Tabs برامج ──
      let html = `<div class="tabs-wrapper"><div class="tabs">`;
      for (const id of visible) {
        const name = PROGRAMS_META[id]?.nameAr || id;
        html += `<button class="tab ${id===activeProgram?"active":""}"
          onclick="switchProgram('${id}')">${name}</button>`;
      }
      html += `</div></div>`;

      // ── محتوى البرنامج النشط ──
      html += buildProgramPanel(activeProgram);

      container.innerHTML = html;
    }

    window.switchProgram = id => {
      activeProgram = id;
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    };

    window.switchYear = yr => {
      currentYear = yr;
      document.querySelectorAll(".yr-btn").forEach(b =>
        b.classList.toggle("active", +b.dataset.yr === yr));
      const panel = document.getElementById("cal-panel");
      if (panel) panel.innerHTML = buildCalendarHTML();
    };

    function buildProgramPanel(id) {
      const meta   = PROGRAMS_META[id] || {};
      const fbData = firebaseData[id]  || {};
      const notes  = fbData.notes      || "";
      const legend = meta.legend       || [];

      // أحداث: Firebase أولاً (يشمل تعديلات الأدمن)، ثم الكود احتياطياً
      const fbEvents2026 = fbData.events       || null;
      const fbEvents2027 = fbData.events_2027  || null;
      const codeEvents   = EVENTS_2026[id]     || {};
      const events = currentYear === 2026
        ? (fbEvents2026 !== null ? fbEvents2026 : codeEvents)
        : (fbEvents2027 !== null ? fbEvents2027 : {});

      // legend html
      let legendHtml = "";
      if (legend.length) {
        legendHtml = `<div class="legend">` +
          legend.map(l => `<div class="legend-item">
            <span class="legend-dot" style="background:${l.color}"></span>
            <span>${l.label}</span>
          </div>`).join("") +
          `</div>`;
      }

      return `
        <div class="program-panel">
          <div class="panel-top">
            ${legendHtml}
            <div class="panel-controls">
              <div class="yr-switcher">
                <button class="yr-btn ${currentYear===2026?"active":""}" data-yr="2026"
                  onclick="switchYear(2026)">2026</button>
                <button class="yr-btn ${currentYear===2027?"active":""}" data-yr="2027"
                  onclick="switchYear(2027)">2027</button>
              </div>
              <button class="pdf-btn" onclick="exportPDF('${id}')">
                ⬇ تصدير PDF
              </button>
            </div>
          </div>
          <div id="cal-panel">${buildCalendarHTML(id, events)}</div>
          ${notes ? `<div class="notes-box"><span class="notes-label">ملاحظات:</span> ${notes}</div>` : ""}
        </div>`;
    }

    function buildCalendarHTML(id, eventsOverride) {
      const progId = id || activeProgram;
      const fbData = firebaseData[progId] || {};
      let events;
      if (eventsOverride !== undefined) {
        events = eventsOverride;
      } else {
        const fb2026 = fbData.events      || null;
        const fb2027 = fbData.events_2027 || null;
        const code26 = EVENTS_2026[progId] || {};
        events = currentYear === 2026
          ? (fb2026 !== null ? fb2026 : code26)
          : (fb2027 !== null ? fb2027 : {});
      }

      const yr  = currentYear;
      const now = new Date();

      let html = `<div class="year-grid">`;
      for (let m = 0; m < 12; m++) {
        const fd  = new Date(yr, m, 1).getDay();
        const dim = new Date(yr, m+1, 0).getDate();
        html += `<div class="month-card">
          <div class="month-name">${MONTHS_AR[m]}</div>
          <div class="days-header">`;
        DAYS_AR.forEach(d => { html += `<span>${d}</span>`; });
        html += `</div><div class="days-grid">`;
        for (let i=0; i<fd; i++) html += `<span></span>`;
        for (let d=1; d<=dim; d++) {
          const ds      = `${yr}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
          const type    = events[ds] || "";
          const isToday = now.getFullYear()===yr && now.getMonth()===m && now.getDate()===d;
          const phases     = (firebaseData[progId]?.phases || []);
          const phaseLabel = getPhaseLabel(ds, phases);
          const tipText    = phaseLabel
            ? `${phaseLabel}${type === "exam" ? " — اختبارات" : type === "holiday" ? " — إجازة" : type === "break" ? " — إجازة نهاية الفصل" : ""}`
            : (type === "exam" ? "أسبوع الاختبارات" : type === "holiday" ? "إجازة رسمية" : type === "break" ? "إجازة نهاية الفصل" : type === "study" ? "أسبوع دراسي" : type === "obm" ? "جلسة مباشرة" : "");
          html += `<span class="day ${type} ${isToday?"today":""} ${phaseLabel?"has-phase":""}"
            data-tip="${tipText}">${d}</span>`;
        }
        html += `</div></div>`;
      }
      html += `</div>`;
      return html;
    }

    // ═══════════════════════════════════════════
    // PDF Export — صفحة واحدة A4 أفقية
    // ═══════════════════════════════════════════
    window.exportPDF = async (progId) => {
      const btn  = document.querySelector(".pdf-btn");
      const meta = PROGRAMS_META[progId] || {};
      const name = meta.nameAr || progId;

      btn.disabled = true;
      btn.textContent = "⏳ جاري التصدير...";

      try {
        const { jsPDF } = window.jspdf;

        const fbData = firebaseData[progId] || {};
        const events = currentYear === 2026
          ? (EVENTS_2026[progId] || {})
          : (fbData.events_2027 || {});

        const legend = meta.legend || [];

        // A4 landscape = 297×210mm → عند 96dpi ≈ 1122×794px
        // نجعل printDiv عرض 1100px ثابت لضمان صفحة واحدة
        const printDiv = document.createElement("div");
        printDiv.style.cssText = `
          position:fixed;
          top:0; left:0;
          width:1122px;
          min-height:794px;
          background:#fff;
          padding:28px 32px 24px;
          font-family:'Tajawal',sans-serif;
          direction:rtl;
          box-sizing:border-box;
          overflow:hidden;
        `;

        // ── Header ──
        printDiv.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;
            margin-bottom:14px;padding-bottom:12px;border-bottom:3px solid #0D40FC;">
            <div>
              <div style="font-size:20px;font-weight:800;color:#001442;margin-bottom:2px;">
                سلوكيرا – التقويم الأكاديمي ${currentYear}
              </div>
              <div style="font-size:13px;color:#6b7a9a;">${name}</div>
            </div>
            <div style="width:52px;height:52px;
              background:linear-gradient(135deg,#0D40FC,#55D7FF);
              border-radius:14px;display:flex;align-items:center;justify-content:center;
              font-size:24px;font-weight:800;color:#fff;flex-shrink:0;">س</div>
          </div>

          <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;align-items:center;">
            ${legend.map(l=>`
              <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:#444;">
                <span style="width:14px;height:14px;border-radius:4px;
                  background:${l.color};display:inline-block;flex-shrink:0;"></span>
                ${l.label}
              </div>`).join("")}
          </div>

          <div id="pdf-months-grid"
            style="display:grid;grid-template-columns:repeat(6,1fr);
              grid-template-rows:repeat(2,1fr);gap:10px;flex:1;">
            ${buildPrintCalendar(events, currentYear)}
          </div>

          <div style="margin-top:12px;text-align:center;font-size:10px;color:#bbb;">
            sulukera.com — جميع الحقوق محفوظة © ${currentYear}
          </div>`;

        // إخفاء عن المستخدم أثناء التقاط
        printDiv.style.visibility = "hidden";
        document.body.appendChild(printDiv);

        // انتظر تحميل الخطوط
        await document.fonts.ready;
        await new Promise(r => setTimeout(r, 300));

        printDiv.style.visibility = "visible";

        const canvas = await html2canvas(printDiv, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: "#ffffff",
          logging: false,
          width:  1122,
          height: printDiv.scrollHeight,
          windowWidth: 1122,
        });

        document.body.removeChild(printDiv);

        const { jsPDF: PDF } = window.jspdf;
        const pdf   = new PDF({ orientation: "landscape", unit: "mm", format: "a4" });
        const pageW = pdf.internal.pageSize.getWidth();   // 297mm
        const pageH = pdf.internal.pageSize.getHeight();  // 210mm

        // ضغط الصورة لتناسب الصفحة بدون قطع
        const imgW   = canvas.width;
        const imgH   = canvas.height;
        const scale  = Math.min(pageW / (imgW / 2), pageH / (imgH / 2));
        const finalW = (imgW / 2) * scale;
        const finalH = (imgH / 2) * scale;
        const offX   = (pageW - finalW) / 2;
        const offY   = (pageH - finalH) / 2;

        pdf.addImage(canvas.toDataURL("image/png","1.0"), "PNG",
          offX, offY, finalW, finalH);

        pdf.save(`sulukera-${progId}-${currentYear}.pdf`);

      } catch (e) {
        console.error(e);
        alert("حدث خطأ أثناء التصدير: " + e.message);
      }

      btn.disabled = false;
      btn.textContent = "⬇ تصدير PDF";
    };

    function buildPrintCalendar(events, yr) {
      // الأشهر بالترتيب الصحيح: يناير → ديسمبر (من اليمين لليسار في grid)
      // grid-template-columns: repeat(6,1fr) → صفان × ٦ أعمدة = ١٢ شهر
      const TYPE_COLORS = {
        study:   "#BFE3FF",
        exam:    "#FF6B35",
        break:   "#D8B4FE",
        holiday: "#FDE68A",
        obm:     "#0D40FC",
      };
      const TYPE_TEXT = {
        study: "#0D40FC", exam: "#fff", break: "#5b21b6",
        holiday: "#92400e", obm: "#fff",
      };

      let html = "";
      for (let m = 0; m < 12; m++) {
        const fd  = new Date(yr, m, 1).getDay();
        const dim = new Date(yr, m+1, 0).getDate();

        // حجم الخلية: عرض الشهر ≈ (1122-64-50)/6 ≈ 168px
        // ارتفاع الشهر للصف الواحد: max 6 أسابيع × 22px + header
        html += `
        <div style="background:#f8faff;border:1px solid #dde5ff;border-radius:10px;
          padding:8px 6px;display:flex;flex-direction:column;">
          <div style="font-size:13px;font-weight:700;color:#001442;
            text-align:center;margin-bottom:6px;">${MONTHS_AR[m]}</div>

          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:2px;">
            ${["ح","ن","ث","ر","خ","ج","س"].map(d=>
              `<span style="text-align:center;font-size:9px;font-weight:700;
                color:#8899bb;padding:1px 0;">${d}</span>`
            ).join("")}
          </div>

          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;flex:1;">
            ${Array(fd).fill(`<span></span>`).join("")}
            ${Array.from({length:dim},(_,i)=>{
              const d    = i+1;
              const ds   = `${yr}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
              const type = events[ds] || "";
              const bg   = TYPE_COLORS[type] || "transparent";
              const tc   = TYPE_TEXT[type]   || "#222";
              const fw   = type ? "700" : "400";
              return `<span style="
                display:flex;align-items:center;justify-content:center;
                aspect-ratio:1;font-size:10px;font-weight:${fw};
                border-radius:5px;
                background-color:${bg};
                color:${tc};
                -webkit-print-color-adjust:exact;
                print-color-adjust:exact;
              ">${d}</span>`;
            }).join("")}
          </div>
        </div>`;
      }
      return html;
    }
  </script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --blue:#0D40FC;--cyan:#55D7FF;--navy:#001442;

      --muted:#6b7a9a;--border:#e0e8ff;--r:16px;

      background: linear-gradient(135deg, #000e2e 0%, #001442 60%, #001e5a 100%);

      min-height: 80px;

    header::after {
      content: "";

      animation: glowLine 3s ease-in-out infinite;

    /* Calendar grid */

    .day[data-tip]:not([data-tip=""]):hover::after {

      position: absolute;
      bottom: calc(100% + 1px);
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: #001442;
      pointer-events: none;
      z-index: 100;
    }
    .day[data-tip]:not([data-tip=""]) { position: relative; }
    .day.has-phase { outline: 1.5px solid rgba(13,64,252,.2); outline-offset: -1px; }

    /* Footer */
    footer{text-align:center;padding:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);}

    @media(max-width:600px){
      header{padding:0 16px;min-height:64px;gap:12px;}
      .header-logo-img{height:38px;}
      .header-divider{height:26px;}
      .header-text h1{font-size:15px;}
      main{padding:20px 12px 40px;}
      .year-grid{grid-template-columns:1fr 1fr;gap:8px;}
      .month-card{padding:10px 8px;}
      .panel-top{flex-direction:column;}
      .panel-controls{width:100%;justify-content:space-between;}
    }
  </style>
</head>
