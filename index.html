<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقويم الأكاديمي — سلوكيرا</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}:root{--navy:#001442;--blue:#0d40fc;--cyan:#55d7ff;--bg:#f3f6ff;--line:#dce4ff;--muted:#6b7694}body{margin:0;background:var(--bg);font-family:Tajawal,sans-serif;color:#111a32}header{background:linear-gradient(125deg,#001442,#062a7a);color:#fff;padding:20px 28px;display:flex;align-items:center;gap:14px}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));font-weight:900}.head h1{font-size:19px;margin:0}.head p{font-size:11px;color:var(--cyan);margin:2px 0 0}.nav{margin-right:auto;display:flex;gap:9px}.nav a{color:#fff;text-decoration:none;border:1px solid #ffffff2a;padding:8px 12px;border-radius:9px;font-size:12px}main{max-width:1300px;margin:auto;padding:34px 18px 70px}.hero{text-align:center;margin-bottom:28px}.hero h2{font-size:29px;color:var(--navy);margin:0 0 7px}.hero p{color:var(--muted);margin:0}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:20px;padding-bottom:5px}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 16px;border-radius:25px;white-space:nowrap;cursor:pointer}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}.plan-info{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 19px;margin-bottom:17px;display:flex;justify-content:space-between;gap:15px;align-items:center}.plan-info h3{margin:0 0 4px;color:var(--navy)}.plan-info p{margin:0;color:var(--muted);font-size:12px}.key{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:4px}.months{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.month{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 7px 24px #00144209}.month h3{margin:0 0 11px;text-align:center;color:var(--navy);font-size:16px}.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow span{text-align:center;font-size:10px;color:var(--muted);font-weight:700;padding-bottom:5px}.day{min-height:72px;border:1px solid #edf0fa;border-radius:8px;padding:4px;overflow:hidden;position:relative}.day.empty-day{border-color:transparent}.num{font-size:11px;font-weight:700;color:#68718b}.today{box-shadow:inset 0 0 0 2px var(--blue)}.event{font-size:9px;padding:3px 4px;border-radius:5px;margin-top:3px;line-height:1.25;background:#e8edff;color:#123ec6;overflow:hidden}.event.exam{background:#fff0e8;color:#b74411}.event.break{background:#f4eaff;color:#7222a8}.event.course{background:#e5faf3;color:#087755}.event.holiday{background:#fff6d9;color:#865400}.event.start{border-right:3px solid currentColor}.event.end{border-left:3px solid currentColor}.marker{font-weight:900}.empty{background:#fff;border:1px dashed #b9c7ee;border-radius:20px;padding:60px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--navy);font-size:18px}.holidays{margin-top:30px}.holiday-row{display:flex;gap:8px;overflow:auto}.holiday-pill{flex:0 0 auto;background:#fff8e1;border:1px solid #ffe08a;color:#754800;border-radius:25px;padding:8px 12px;font-size:11px}footer{text-align:center;color:var(--muted);font-size:11px;padding:22px}@media(max-width:1050px){.months{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){header{padding:14px}.nav a:first-child{display:none}main{padding:25px 8px}.months{grid-template-columns:1fr}.plan-info{display:block}.key{margin-top:10px}.day{min-height:64px}.hero h2{font-size:23px}}
</style></head><body><header><div class="logo">س</div><div class="head"><h1>سلوكيرا — التقويم الأكاديمي</h1><p>ACADEMIC CALENDAR</p></div><nav class="nav"><a href="schedule.html">الجداول</a><a href="planner.html">دخول الإدارة</a></nav></header><main><section class="hero"><h2>التقويم الأكاديمي</h2><p>تواريخ بداية ونهاية الفصول والاختبارات والإجازات</p></section><div id="app"><div class="empty"><b>جاري تحميل البرامج…</b></div></div><section class="holidays"><h2>المناسبات والإجازات السعودية</h2><div id="holidays" class="holiday-row"></div></section></main><footer>© سلوكيرا — جميع الحقوق محفوظة</footer>
<script type="module">import{db}from"./js/firebase.js";import{collection,onSnapshot,query,where}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";import{SAUDI_EVENTS,parseDate,formatDate}from"./js/scheduler.js";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let plans=[],active=0;const app=document.getElementById("app"),monthsAr=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"],daysAr=["ح","ن","ث","ر","خ","ج","س"];
function datesBetween(a,b){const out=[],d=parseDate(a),end=parseDate(b);while(d<=end){out.push(formatDate(d));d.setDate(d.getDate()+1)}return out}function monthKey(d){return d.slice(0,7)}
function render(){if(!plans.length){app.innerHTML='<div class="empty"><b>لا توجد برامج منشورة حاليًا</b>ستظهر البرامج بعد اعتمادها من الإدارة.</div>';return}active=Math.min(active,plans.length-1);const p=plans[active],map={},blocks=p.blocks||[],groupKey=b=>b.isSemesterBreak?`break-${b.id}`:b.semesterName||b.unitNumber&&`unit-${b.unitNumber}`||b.label;blocks.forEach((b,i)=>{const key=groupKey(b),groupStart=i===0||groupKey(blocks[i-1])!==key,groupEnd=i===blocks.length-1||groupKey(blocks[i+1])!==key;datesBetween(b.start,b.end).forEach(date=>(map[date]??=[]).push({...b,isStart:groupStart&&date===b.start,isEnd:groupEnd&&date===b.end}))});SAUDI_EVENTS.filter(e=>e.end>=p.startDate&&e.start<=p.endDate).forEach(e=>datesBetween(e.start,e.end).forEach(date=>(map[date]??=[]).push({type:"holiday",label:e.name,isStart:date===e.start,isEnd:date===e.end})));const keys=[];let d=parseDate(p.startDate),end=parseDate(p.endDate);while(d<=end){const k=monthKey(formatDate(d));if(!keys.includes(k))keys.push(k);d=new Date(d.getFullYear(),d.getMonth()+1,1)}app.innerHTML=`<div class="tabs">${plans.map((x,i)=>`<button class="tab ${i===active?'active':''}" data-tab="${i}">${esc(x.title)}</button>`).join('')}</div><div class="plan-info"><div><h3>${esc(p.title)}</h3><p>يبدأ ${p.startDate} · ينتهي ${p.endDate}</p></div><div class="key"><span><i style="background:#0d40fc"></i>دراسة</span><span><i style="background:#ff6b35"></i>اختبارات</span><span><i style="background:#9c36e8"></i>إجازة</span><span><i style="background:#0ca678"></i>وحدة</span></div></div><div class="months">${keys.map(k=>renderMonth(k,map)).join('')}</div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.tab);render()})}
function renderMonth(k,map){const[y,m]=k.split('-').map(Number),fd=new Date(y,m-1,1).getDay(),dim=new Date(y,m,0).getDate();let cells='<div class="day empty-day"></div>'.repeat(fd);for(let n=1;n<=dim;n++){const ds=`${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`,events=map[ds]||[],today=ds===new Date().toISOString().slice(0,10);cells+=`<div class="day ${today?'today':''}"><span class="num">${n}</span>${events.map(e=>{const name=e.semesterName||e.label;return `<div class="event ${e.type} ${e.isStart?'start':''} ${e.isEnd?'end':''}" title="${esc(e.label)}${e.start?' · '+e.start+' — '+e.end:''}">${e.isStart?'<span class="marker">بداية · </span>':''}${esc(name)}${e.isEnd?'<span class="marker"> · نهاية</span>':''}</div>`}).join('')}</div>`}return `<section class="month"><h3>${monthsAr[m-1]} ${y}</h3><div class="dow">${daysAr.map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells}</div></section>`}
onSnapshot(query(collection(db,"academic_plans"),where("visibleToStudents","==",true)),snap=>{plans=snap.docs.map(d=>d.data()).filter(p=>p.status==="published").sort((a,b)=>a.startDate.localeCompare(b.startDate));render()},()=>app.innerHTML='<div class="empty"><b>تعذر تحميل التقويم</b>راجعي الاتصال.</div>');const today=new Date().toISOString().slice(0,10);document.getElementById("holidays").innerHTML=SAUDI_EVENTS.filter(e=>e.end>=today).map(e=>`<span class="holiday-pill">${esc(e.name)} · ${e.start}${e.status==='tentative'?' (متوقع)':''}</span>`).join('');</script></body></html>
