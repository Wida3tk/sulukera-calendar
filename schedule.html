<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>جداول المحاضرات — سلوكيرا</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, deleteDoc, onSnapshot, collection, getDocs }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCJG0sOcs0Wr6QslTUKmDshs9LapFyjs1w",
      authDomain: "sulukera-calendar.firebaseapp.com",
      projectId: "sulukera-calendar",
      storageBucket: "sulukera-calendar.firebasestorage.app",
      messagingSenderId: "729863935633",
      appId: "1:729863935633:web:c3069e853fa11e4d4b9130"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    const ALL_PROGRAMS = [
      { id:"ABA",      nameAr:"برنامج ABA"      },
      { id:"ABA_MAY",  nameAr:"ABA — دفعة مايو" },
      { id:"BATCH_11", nameAr:"دفعة 11"          },
      { id:"BATCH_10", nameAr:"دفعة 10"          },
      { id:"OBM",      nameAr:"OBM-P Live"       },
      { id:"BE",       nameAr:"برنامج BE"         },
      { id:"ABAT",     nameAr:"ABAT Live"        },
      { id:"OBM_EC",   nameAr:"OBM E&C"          },
    ];

    const DAYS_AR = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];

    // حالة
    let isAdmin      = false;
    let allCalData   = {};   // calendars collection
    let subjects     = [];   // المقررات
    let instructors  = [];   // المحاضرون
    let schedules    = {};   // schedules collection: key = progId_phaseIdx
    let activeProgram = null;

    // ── Auth ──
    onAuthStateChanged(auth, user => {
      isAdmin = !!user;
      document.querySelectorAll(".admin-only").forEach(el =>
        el.style.display = isAdmin ? "" : "none");
      document.getElementById("login-fab").style.display = isAdmin ? "none" : "flex";
    });

    window.doLogin = async () => {
      const e = document.getElementById("fab-email").value.trim();
      const p = document.getElementById("fab-pass").value;
      try { await signInWithEmailAndPassword(auth, e, p); closeLoginPopup(); }
      catch { document.getElementById("fab-err").textContent = "بيانات خاطئة"; }
    };
    window.doLogout = () => signOut(auth);
    window.toggleLoginPopup = () => {
      const popup = document.getElementById("login-popup");
      popup.style.display = popup.style.display === "flex" ? "none" : "flex";
    };
    window.closeLoginPopup = () => {
      document.getElementById("login-popup").style.display = "none";
    };

    // ── Load Data ──
    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("fab-pass")?.addEventListener("keydown", e => {
        if (e.key === "Enter") window.doLogin();
      });

      // قراءة البرامج (للفصول)
      onSnapshot(collection(db,"calendars"), snap => {
        allCalData = {};
        snap.forEach(d => { allCalData[d.id] = d.data(); });
        renderProgramTabs();
      });

      // قراءة المقررات
      onSnapshot(collection(db,"subjects"), snap => {
        subjects = [];
        snap.forEach(d => subjects.push({id:d.id,...d.data()}));
        subjects.sort((a,b)=>a.name.localeCompare(b.name,"ar"));
      });

      // قراءة المحاضرين
      onSnapshot(collection(db,"instructors"), snap => {
        instructors = [];
        snap.forEach(d => instructors.push({id:d.id,...d.data()}));
        instructors.sort((a,b)=>a.name.localeCompare(b.name,"ar"));
      });

      // قراءة الجداول
      onSnapshot(collection(db,"schedules"), snap => {
        schedules = {};
        snap.forEach(d => { schedules[d.id] = d.data(); });
        if (activeProgram) renderScheduleView();
      });

      // URL param
      const urlParam = new URLSearchParams(window.location.search).get("program");
      if (urlParam) activeProgram = urlParam;
    });

    // ── Tabs البرامج ──
    function renderProgramTabs() {
      const visible = ALL_PROGRAMS.filter(p => allCalData[p.id]?.visible);
      if (!visible.length) return;
      if (!activeProgram || !visible.find(p=>p.id===activeProgram))
        activeProgram = visible[0].id;

      const tabsEl = document.getElementById("prog-tabs");
      tabsEl.innerHTML = visible.map(p => `
        <button class="ptab ${p.id===activeProgram?"active":""}"
          onclick="selectProgram('${p.id}')">${p.nameAr}</button>
      `).join("");

      renderScheduleView();
    }

    window.selectProgram = id => {
      activeProgram = id;
      renderProgramTabs();
    };

    // ── عرض الجداول للبرنامج ──
    function renderScheduleView() {
      const container = document.getElementById("schedule-container");
      if (!activeProgram) { container.innerHTML = ""; return; }

      const phases = allCalData[activeProgram]?.phases || [];
      if (!phases.length) {
        container.innerHTML = `<div class="no-phases">
          <p>لا توجد فصول دراسية لهذا البرنامج بعد</p>
          <p style="font-size:13px;color:var(--muted);margin-top:6px;">أضيفي الفصول أولاً من <a href="admin.html">لوحة التحكم</a></p>
        </div>`;
        return;
      }

      let html = `<div class="phases-tabs">`;
      phases.forEach((ph,i) => {
        const key = `${activeProgram}_${i}`;
        const hasSched = !!schedules[key]?.days?.length;
        html += `<button class="phase-tab ${i===0?"active":""}" data-idx="${i}"
          onclick="selectPhaseTab(this,${i})">${ph.label||`فصل ${i+1}`}
          ${hasSched?'<span class="has-sched">✓</span>':''}</button>`;
      });
      html += `</div>`;

      phases.forEach((ph,i) => {
        const key  = `${activeProgram}_${i}`;
        const sched = schedules[key] || {};
        html += `<div class="phase-panel ${i===0?"active":""}" id="phase-panel-${i}">
          ${buildScheduleCard(ph, sched, i)}
        </div>`;
      });

      container.innerHTML = html;
    }

    window.selectPhaseTab = (btn, idx) => {
      document.querySelectorAll(".phase-tab").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".phase-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`phase-panel-${idx}`)?.classList.add("active");
    };

    // ── بناء بطاقة الجدول ──
    function buildScheduleCard(phase, sched, phaseIdx) {
      const days = sched.days || [];
      const prog = ALL_PROGRAMS.find(p=>p.id===activeProgram);
      const MONTHS_AR = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

      let dateRange = "";
      if (phase.from && phase.to) {
        const f = new Date(phase.from+"T00:00:00");
        const t = new Date(phase.to+"T00:00:00");
        dateRange = `${f.getDate()} ${MONTHS_AR[f.getMonth()]} ${f.getFullYear()}م إلى ${t.getDate()} ${MONTHS_AR[t.getMonth()]} ${t.getFullYear()}م`;
      }

      if (!days.length) {
        return `<div class="empty-sched">
          <p>لا يوجد جدول لهذا الفصل بعد</p>
          ${isAdmin ? `<button class="add-sched-btn" onclick="openScheduleEditor(${phaseIdx})">+ إنشاء الجدول</button>` : ""}
        </div>`;
      }

      // ── بطاقة العرض ──
      let cardHtml = `
        <div class="sched-card" id="sched-card-${phaseIdx}">
          <div class="sched-card-header">
            <div class="sched-logo">
              <div class="sched-logo-mark">س</div>
              <div>
                <div class="sched-brand">سلوكيرا <span style="font-weight:400;font-size:12px;">Sulukera</span></div>
              </div>
            </div>
            <div class="sched-title-block">
              <div class="sched-main-title">جدول المحاضرات الأسبوعية</div>
              <div class="sched-badges">
                <span class="sched-badge-code">${sched.code||phase.label||""}</span>
                <span class="sched-badge-phase">${phase.label||""}</span>
              </div>
            </div>
          </div>

          <div class="sched-rows">`;

      days.forEach(day => {
        cardHtml += `
            <div class="sched-row">
              <div class="sched-day-name">${day.dayName}</div>
              <div class="sched-subject-block">
                <div class="sched-subject-name">${day.subject}</div>
                <div class="sched-instructor">أ. ${day.instructor}</div>
              </div>
              <div class="sched-time-block">
                <div class="sched-time">${day.timeFrom}</div>
                <div class="sched-time-sep">إلى</div>
                <div class="sched-time">${day.timeTo}</div>
              </div>
            </div>`;
      });

      cardHtml += `
          </div>

          ${dateRange ? `
          <div class="sched-footer">
            يمتد الفصل الدراسي من ${dateRange}
          </div>` : ""}
        </div>

        <div class="sched-actions">
          <button class="sched-export-btn" onclick="exportSchedule(${phaseIdx})">⬇ تحميل صورة</button>
          ${isAdmin ? `<button class="sched-edit-btn admin-only" onclick="openScheduleEditor(${phaseIdx})">✏️ تعديل</button>` : ""}
        </div>`;

      return cardHtml;
    }

    // ══════════════════════════════════════
    // SCHEDULE EDITOR
    // ══════════════════════════════════════
    let editingPhaseIdx = null;
    let editingDays     = [];

    window.openScheduleEditor = idx => {
      editingPhaseIdx = idx;
      const key   = `${activeProgram}_${idx}`;
      const sched = schedules[key] || {};
      editingDays = JSON.parse(JSON.stringify(sched.days || []));

      const phases = allCalData[activeProgram]?.phases || [];
      const phase  = phases[idx] || {};
      document.getElementById("sched-editor-title").textContent =
        `جدول: ${phase.label||"فصل "+(idx+1)}`;
      document.getElementById("sched-code-input").value = sched.code || "";

      renderEditorDays();
      document.getElementById("sched-editor-overlay").style.display = "flex";
    };

    window.closeScheduleEditor = () => {
      document.getElementById("sched-editor-overlay").style.display = "none";
    };

    function renderEditorDays() {
      const list = document.getElementById("sched-days-list");
      if (!editingDays.length) {
        list.innerHTML = `<div class="editor-empty">اضغطي "+ إضافة يوم" للبدء</div>`;
        return;
      }
      list.innerHTML = editingDays.map((day,i) => `
        <div class="sched-day-row">
          <div class="sched-day-row-header">
            <span class="sched-day-num">${i+1}</span>
            <button class="sched-del-day" onclick="deleteDay(${i})">✕</button>
          </div>
          <div class="sched-day-fields">
            <div class="sdf-group">
              <label>اليوم</label>
              <select class="sdf-input" onchange="updateDay(${i},'dayName',this.value)">
                ${DAYS_AR.map(d=>`<option value="${d}" ${day.dayName===d?"selected":""}>${d}</option>`).join("")}
              </select>
            </div>
            <div class="sdf-group">
              <label>المقرر</label>
              <select class="sdf-input" onchange="updateDay(${i},'subject',this.value)">
                <option value="">اختاري...</option>
                ${subjects.map(s=>`<option value="${s.name}" ${day.subject===s.name?"selected":""}>${s.name}</option>`).join("")}
                <option value="__custom__">إضافة مقرر جديد...</option>
              </select>
            </div>
            <div class="sdf-group">
              <label>المحاضر</label>
              <select class="sdf-input" onchange="updateDay(${i},'instructor',this.value)">
                <option value="">اختاري...</option>
                ${instructors.map(s=>`<option value="${s.name}" ${day.instructor===s.name?"selected":""}>${s.name}</option>`).join("")}
                <option value="__custom__">إضافة محاضر جديد...</option>
              </select>
            </div>
            <div class="sdf-group">
              <label>من</label>
              <input class="sdf-input" type="time" value="${day.timeFrom||""}"
                oninput="updateDay(${i},'timeFrom',this.value)"/>
            </div>
            <div class="sdf-group">
              <label>إلى</label>
              <input class="sdf-input" type="time" value="${day.timeTo||""}"
                oninput="updateDay(${i},'timeTo',this.value)"/>
            </div>
          </div>
        </div>`).join("");
    }

    window.updateDay = (i, field, val) => {
      if (val === "__custom__") {
        const name = prompt(field==="subject"?"اسم المقرر الجديد:":"اسم المحاضر الجديد:");
        if (!name) return;
        if (field==="subject") {
          setDoc(doc(db,"subjects",name.replace(/\s/g,"_")),{name},{merge:true});
          editingDays[i].subject = name;
        } else {
          setDoc(doc(db,"instructors",name.replace(/\s/g,"_")),{name},{merge:true});
          editingDays[i].instructor = name;
        }
        setTimeout(renderEditorDays, 500);
        return;
      }
      editingDays[i][field] = val;
    };

    window.addDay = () => {
      editingDays.push({ dayName:"الأحد", subject:"", instructor:"", timeFrom:"18:00", timeTo:"20:30" });
      renderEditorDays();
    };

    window.deleteDay = i => {
      editingDays.splice(i,1);
      renderEditorDays();
    };

    window.saveSchedule = async () => {
      const btn  = document.getElementById("save-sched-btn");
      const code = document.getElementById("sched-code-input").value.trim();
      btn.disabled=true; btn.textContent="جاري الحفظ...";
      try {
        const key = `${activeProgram}_${editingPhaseIdx}`;
        await setDoc(doc(db,"schedules",key), {
          progId: activeProgram,
          phaseIdx: editingPhaseIdx,
          code,
          days: editingDays,
          updatedAt: new Date().toISOString()
        });
        showToast("✓ تم حفظ الجدول");
        closeScheduleEditor();
        btn.textContent="حفظ الجدول";
        btn.disabled=false;
      } catch(e) {
        showToast("خطأ في الحفظ","error");
        btn.disabled=false; btn.textContent="حفظ الجدول";
      }
    };

    // ══════════════════════════════════════
    // LISTS MANAGER (المقررات والمحاضرون)
    // ══════════════════════════════════════
    window.openListsManager = () => {
      document.getElementById("lists-overlay").style.display = "flex";
      renderListsView();
    };
    window.closeListsManager = () => {
      document.getElementById("lists-overlay").style.display = "none";
    };

    function renderListsView() {
      const subList = document.getElementById("subjects-list-view");
      const instList = document.getElementById("instructors-list-view");

      subList.innerHTML = subjects.map(s => `
        <div class="list-item">
          <span>${s.name}</span>
          <button onclick="deleteListItem('subjects','${s.id}')" class="list-del">✕</button>
        </div>`).join("") || '<p class="list-empty">لا توجد مقررات</p>';

      instList.innerHTML = instructors.map(s => `
        <div class="list-item">
          <span>${s.name}</span>
          <button onclick="deleteListItem('instructors','${s.id}')" class="list-del">✕</button>
        </div>`).join("") || '<p class="list-empty">لا يوجد محاضرون</p>';
    }

    window.addListItem = async (type) => {
      const input = document.getElementById(`new-${type}-input`);
      const name  = input.value.trim();
      if (!name) return;
      await setDoc(doc(db, type, name.replace(/\s+/g,"_")+"_"+Date.now()), { name });
      input.value = "";
      showToast("✓ تمت الإضافة");
    };

    window.deleteListItem = async (type, id) => {
      if (!confirm("حذف؟")) return;
      await deleteDoc(doc(db, type, id));
    };

    // ══════════════════════════════════════
    // EXPORT
    // ══════════════════════════════════════
    window.exportSchedule = async (phaseIdx) => {
      const card = document.getElementById(`sched-card-${phaseIdx}`);
      if (!card) return;
      const btn = document.querySelector(`#phase-panel-${phaseIdx} .sched-export-btn`);
      if (btn) { btn.disabled=true; btn.textContent="⏳..."; }

      try {
        await document.fonts.ready;
        const canvas = await html2canvas(card, {
          scale: 3, useCORS: true, backgroundColor: "#ffffff",
          logging: false
        });
        const link    = document.createElement("a");
        link.download = `sulukera-schedule-${activeProgram}-${phaseIdx}.png`;
        link.href     = canvas.toDataURL("image/png");
        link.click();
      } catch(e) { alert("خطأ في التصدير"); }

      if (btn) { btn.disabled=false; btn.textContent="⬇ تحميل صورة"; }
    };

    // ── Toast / Snack ──
    window.showToast = (msg, type="success") => {
      const t = document.getElementById("toast");
      t.textContent=msg; t.className=`toast show ${type}`;
      setTimeout(()=>t.classList.remove("show"),3000);
    };
  </script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --blue:#0D40FC;--cyan:#55D7FF;--navy:#001442;
      --bg:#f0f3ff;--card:#fff;--text:#0a1628;
      --muted:#6b7a9a;--border:#e0e8ff;--r:16px;
    }
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;}

    /* Header */
    header{background:var(--navy);padding:18px 28px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;}
    header::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue),var(--cyan),var(--blue),transparent);animation:glowLine 3s ease-in-out infinite;}
    @keyframes glowLine{0%,100%{opacity:.4}50%{opacity:1}}
    .hdr-logo{height:44px;width:auto;filter:brightness(0) invert(1);}
    .hdr-div{width:1px;height:30px;background:rgba(255,255,255,.15);}
    .hdr-text h1{font-size:16px;font-weight:700;color:#fff;}
    .hdr-text p{font-size:11px;color:var(--cyan);margin-top:1px;}
    .hdr-actions{margin-right:auto;display:flex;gap:10px;align-items:center;}
    .hdr-link{color:rgba(255,255,255,.5);text-decoration:none;font-size:13px;transition:.2s;}
    .hdr-link:hover{color:#fff;}
    .hdr-btn{padding:7px 14px;background:rgba(85,215,255,.15);color:var(--cyan);border:1px solid rgba(85,215,255,.3);border-radius:8px;font-family:'Tajawal',sans-serif;font-size:12px;cursor:pointer;transition:.2s;}
    .hdr-btn:hover{background:rgba(85,215,255,.25);}

    /* Main */
    main{max-width:900px;margin:0 auto;padding:32px 20px 80px;}
    .page-title{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:6px;}
    .page-sub{font-size:14px;color:var(--muted);margin-bottom:28px;}

    /* Program tabs */
    .prog-tabs-wrap{overflow-x:auto;margin-bottom:28px;}
    .prog-tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px;width:fit-content;min-width:100%;}
    .ptab{padding:9px 20px;border:none;background:transparent;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;transition:.2s;white-space:nowrap;}
    .ptab:hover{background:var(--bg);}
    .ptab.active{background:var(--blue);color:#fff;font-weight:700;}

    /* Phase tabs */
    .phases-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
    .phase-tab{padding:8px 18px;border:1.5px solid var(--border);background:var(--card);border-radius:20px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.2s;display:flex;align-items:center;gap:6px;}
    .phase-tab:hover{border-color:var(--blue);color:var(--blue);}
    .phase-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
    .has-sched{font-size:11px;color:#6ee7b7;}
    .phase-panel{display:none;}
    .phase-panel.active{display:block;}

    /* Empty states */
    .no-phases,.empty-sched{text-align:center;padding:60px 20px;color:var(--muted);}
    .no-phases p,.empty-sched p{font-size:15px;}
    .add-sched-btn{margin-top:16px;padding:11px 24px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}

    /* ════ SCHEDULE CARD ════ */
    .sched-card{
      background:#fff;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 8px 32px rgba(0,20,66,.12);
      margin-bottom:16px;
      max-width:560px;
      margin-left:auto;
      margin-right:auto;
    }

    .sched-card-header{
      background:var(--navy);
      padding:22px 24px 18px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      position:relative;
      overflow:hidden;
    }
    .sched-card-header::before{
      content:"";position:absolute;top:-40px;left:-40px;
      width:160px;height:160px;
      background:rgba(255,255,255,.04);border-radius:50%;
    }
    .sched-card-header::after{
      content:"سلوكيرا";position:absolute;
      bottom:-10px;right:16px;
      font-size:80px;font-weight:900;
      color:rgba(255,255,255,.04);
      font-family:'Tajawal',sans-serif;
    }

    .sched-logo{display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
    .sched-logo-mark{width:38px;height:38px;background:linear-gradient(135deg,var(--blue),var(--cyan));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;flex-shrink:0;}
    .sched-brand{font-size:14px;font-weight:700;color:#fff;}

    .sched-title-block{text-align:left;position:relative;z-index:1;}
    .sched-main-title{font-size:17px;font-weight:800;color:#fff;margin-bottom:8px;text-align:right;}
    .sched-badges{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
    .sched-badge-code{background:var(--blue);color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;}
    .sched-badge-phase{background:rgba(255,255,255,.15);color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;}

    .sched-rows{padding:16px;}
    .sched-row{
      display:flex;align-items:center;gap:0;
      background:var(--navy);
      border-radius:14px;
      margin-bottom:10px;
      overflow:hidden;
    }
    .sched-day-name{
      background:var(--navy);color:#fff;
      font-size:16px;font-weight:800;
      padding:18px 16px;min-width:90px;
      text-align:center;flex-shrink:0;
    }
    .sched-subject-block{
      flex:1;background:#fff;padding:14px 16px;
    }
    .sched-subject-name{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:3px;}
    .sched-instructor{font-size:13px;color:var(--muted);}
    .sched-time-block{
      background:#fff;padding:14px 16px;
      text-align:center;flex-shrink:0;min-width:80px;
      border-right:1px solid var(--border);
    }
    .sched-time{font-size:13px;font-weight:700;color:var(--navy);direction:ltr;}
    .sched-time-sep{font-size:10px;color:var(--muted);margin:2px 0;}

    .sched-footer{
      margin:0 16px 16px;
      background:#eff3ff;border:1px solid var(--border);
      border-radius:10px;padding:12px 16px;
      font-size:13px;font-weight:600;color:var(--blue);text-align:center;
    }

    /* Action buttons */
    .sched-actions{display:flex;gap:10px;justify-content:center;margin-bottom:32px;}
    .sched-export-btn{padding:10px 22px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;}
    .sched-export-btn:hover{background:#002266;}
    .sched-edit-btn{padding:10px 22px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:600;color:var(--blue);cursor:pointer;transition:.2s;}
    .sched-edit-btn:hover{background:var(--blue);color:#fff;}

    /* ════ EDITOR OVERLAY ════ */
    #sched-editor-overlay{
      display:none;position:fixed;inset:0;z-index:1000;
      background:rgba(0,10,35,.8);backdrop-filter:blur(6px);
      align-items:flex-start;justify-content:center;
      padding:16px;overflow-y:auto;
    }
    .sched-editor-panel{
      background:var(--card);border-radius:24px;
      width:100%;max-width:680px;
      box-shadow:0 30px 80px rgba(0,0,0,.3);
      display:flex;flex-direction:column;overflow:hidden;margin:auto;
    }
    .sched-editor-hdr{background:var(--navy);padding:18px 24px;display:flex;align-items:center;gap:14px;}
    .sched-editor-hdr h2{font-size:17px;font-weight:700;color:#fff;flex:1;}
    .sched-editor-close{width:34px;height:34px;background:rgba(255,255,255,.1);border:none;border-radius:8px;color:#fff;font-size:16px;cursor:pointer;}

    .sched-editor-tip{padding:10px 24px;background:#eff3ff;border-bottom:1px solid var(--border);font-size:12px;color:var(--blue);}

    .sched-code-row{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
    .sched-code-row label{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;}
    .sched-code-input{flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Tajawal',sans-serif;font-size:13px;direction:ltr;outline:none;}
    .sched-code-input:focus{border-color:var(--blue);}

    #sched-days-list{padding:16px 24px;display:flex;flex-direction:column;gap:14px;max-height:52vh;overflow-y:auto;}
    .editor-empty{text-align:center;padding:32px;color:var(--muted);font-size:14px;}

    .sched-day-row{background:var(--bg);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;}
    .sched-day-row-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
    .sched-day-num{width:24px;height:24px;background:var(--blue);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
    .sched-del-day{background:transparent;border:1.5px solid #ffcccc;border-radius:6px;color:#cc3333;font-size:13px;cursor:pointer;padding:3px 8px;transition:.2s;}
    .sched-del-day:hover{background:#fee2e2;}
    .sched-day-fields{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:10px;align-items:end;}
    .sdf-group{display:flex;flex-direction:column;gap:4px;}
    .sdf-group label{font-size:11px;font-weight:600;color:var(--muted);}
    .sdf-input{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:'Tajawal',sans-serif;font-size:13px;outline:none;background:#fff;width:100%;}
    .sdf-input:focus{border-color:var(--blue);}

    .add-day-btn{width:calc(100% - 48px);margin:0 24px 16px;padding:11px;background:#eff3ff;border:1.5px dashed var(--blue);border-radius:10px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:600;color:var(--blue);cursor:pointer;transition:.2s;}
    .add-day-btn:hover{background:#dde8ff;}

    .sched-editor-ftr{padding:14px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}
    .sched-cancel-btn{padding:10px 20px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;}
    #save-sched-btn{padding:10px 28px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
    #save-sched-btn:disabled{opacity:.6;cursor:not-allowed;}

    /* ════ LISTS MANAGER ════ */
    #lists-overlay{
      display:none;position:fixed;inset:0;z-index:1001;
      background:rgba(0,10,35,.8);backdrop-filter:blur(6px);
      align-items:flex-start;justify-content:center;
      padding:16px;overflow-y:auto;
    }
    .lists-panel{background:var(--card);border-radius:24px;width:100%;max-width:600px;box-shadow:0 30px 80px rgba(0,0,0,.3);margin:auto;overflow:hidden;}
    .lists-hdr{background:var(--navy);padding:18px 24px;display:flex;align-items:center;gap:14px;}
    .lists-hdr h2{font-size:17px;font-weight:700;color:#fff;flex:1;}
    .lists-close{width:34px;height:34px;background:rgba(255,255,255,.1);border:none;border-radius:8px;color:#fff;font-size:16px;cursor:pointer;}
    .lists-body{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
    .list-section h3{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:12px;}
    .list-add-row{display:flex;gap:8px;margin-bottom:12px;}
    .list-add-input{flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Tajawal',sans-serif;font-size:13px;outline:none;}
    .list-add-input:focus{border-color:var(--blue);}
    .list-add-btn{padding:9px 14px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
    .list-items{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
    .list-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px;}
    .list-del{background:transparent;border:none;color:#cc3333;cursor:pointer;font-size:14px;padding:2px 6px;}
    .list-empty{font-size:13px;color:var(--muted);padding:12px 0;}
    .lists-ftr{padding:14px 24px;border-top:1px solid var(--border);text-align:left;}
    .lists-done-btn{padding:10px 24px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}

    /* Login FAB */
    #login-fab{position:fixed;bottom:24px;left:24px;z-index:900;display:flex;}
    .fab-btn{width:44px;height:44px;background:var(--navy);color:rgba(255,255,255,.4);border:none;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:.2s;}
    .fab-btn:hover{color:#fff;}
    #login-popup{display:none;position:fixed;bottom:80px;left:24px;z-index:901;background:#fff;border-radius:16px;padding:20px;width:260px;box-shadow:0 10px 40px rgba(0,0,0,.2);flex-direction:column;gap:10px;}
    #login-popup p{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px;}
    .pop-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Tajawal',sans-serif;font-size:13px;outline:none;direction:ltr;}
    .pop-input:focus{border-color:var(--blue);}
    .pop-login-btn{width:100%;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
    #fab-err{font-size:12px;color:#f44;min-height:16px;}

    /* Toast */
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;white-space:nowrap;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast.error{background:#c0392b;}

    @media(max-width:600px){
      header{padding:14px 16px;}
      main{padding:20px 12px 60px;}
      .sched-day-fields{grid-template-columns:1fr 1fr;gap:8px;}
      .lists-body{grid-template-columns:1fr;}
      .sched-card{margin:0;}
    }
  </style>
</head>
<body>

<header>
  <div class="hdr-text">
    <h1>سلوكيرا — جداول المحاضرات</h1>
    <p>Academic Schedules</p>
  </div>
  <div class="hdr-actions">
    <a href="index.html" class="hdr-link">← التقويم</a>
    <button class="hdr-btn admin-only" onclick="openListsManager()" style="display:none">⚙ إدارة القوائم</button>
    <button class="hdr-link admin-only" style="display:none;background:transparent;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:13px;color:rgba(255,255,255,.5);" onclick="doLogout()">خروج</button>
  </div>
</header>

<main>
  <h2 class="page-title">جداول المحاضرات الأسبوعية</h2>
  <p class="page-sub">اختاري البرنامج والفصل لعرض الجدول</p>

  <div class="prog-tabs-wrap">
    <div class="prog-tabs" id="prog-tabs">
      <div style="padding:12px 20px;color:var(--muted);font-size:13px;">جاري التحميل...</div>
    </div>
  </div>

  <div id="schedule-container"></div>
</main>

<!-- Schedule Editor Overlay -->
<div id="sched-editor-overlay" onclick="if(event.target===this)closeScheduleEditor()">
  <div class="sched-editor-panel">
    <div class="sched-editor-hdr">
      <h2 id="sched-editor-title">تعديل الجدول</h2>
      <button class="sched-editor-close" onclick="closeScheduleEditor()">✕</button>
    </div>
    <div class="sched-editor-tip">💡 أضيفي أيام المحاضرات — اختاري المقرر والمحاضر من القائمة أو أضيفي جديد</div>
    <div class="sched-code-row">
      <label>كود الفصل (مثل Q1-26):</label>
      <input class="sched-code-input" type="text" id="sched-code-input" placeholder="Q1-26" dir="ltr"/>
    </div>
    <div id="sched-days-list"></div>
    <button class="add-day-btn" onclick="addDay()">+ إضافة يوم</button>
    <div class="sched-editor-ftr">
      <button class="sched-cancel-btn" onclick="closeScheduleEditor()">إلغاء</button>
      <button id="save-sched-btn" onclick="saveSchedule()">حفظ الجدول</button>
    </div>
  </div>
</div>

<!-- Lists Manager Overlay -->
<div id="lists-overlay" onclick="if(event.target===this)closeListsManager()">
  <div class="lists-panel">
    <div class="lists-hdr">
      <h2>إدارة المقررات والمحاضرين</h2>
      <button class="lists-close" onclick="closeListsManager()">✕</button>
    </div>
    <div class="lists-body">
      <div class="list-section">
        <h3>📚 المقررات</h3>
        <div class="list-add-row">
          <input class="list-add-input" type="text" id="new-subjects-input" placeholder="اسم المقرر"/>
          <button class="list-add-btn" onclick="addListItem('subjects')">+</button>
        </div>
        <div class="list-items" id="subjects-list-view"></div>
      </div>
      <div class="list-section">
        <h3>👤 المحاضرون</h3>
        <div class="list-add-row">
          <input class="list-add-input" type="text" id="new-instructors-input" placeholder="اسم المحاضر"/>
          <button class="list-add-btn" onclick="addListItem('instructors')">+</button>
        </div>
        <div class="list-items" id="instructors-list-view"></div>
      </div>
    </div>
    <div class="lists-ftr">
      <button class="lists-done-btn" onclick="closeListsManager()">تم</button>
    </div>
  </div>
</div>

<!-- Login FAB -->
<div id="login-fab">
  <button class="fab-btn" onclick="toggleLoginPopup()" title="دخول الأدمن">⚙</button>
</div>
<div id="login-popup">
  <p>دخول الأدمن</p>
  <input class="pop-input" type="email" id="fab-email" placeholder="البريد الإلكتروني"/>
  <input class="pop-input" type="password" id="fab-pass" placeholder="كلمة السر"/>
  <button class="pop-login-btn" onclick="doLogin()">دخول</button>
  <span id="fab-err"></span>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
